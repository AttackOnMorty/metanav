}

// An item placed by one of the user's tactics (the run sets `tactic`, the order's number) says so, and the mark opens that order.
const tacticOf = q => { const n = Number(q.tactic), o = TACTICS.get().orders || []; return n >= 1 && n <= o.length ? n : 0; };
const tacMark = q => { const n = tacticOf(q); return n ? `<button class="tac" data-tactics="${n}" title="Placed by your tactic: ${e(TACTICS.get().orders[n - 1])}">TACTICS</button>` : ''; };

// Requests = the game's REQUEST list: a status stamp, the request, who asked. Done requests stay at the bottom, stamped DONE!
function stampOf(q) {
  const f = flagOf(q);
  if (q.moved) return '<span class="st upd">MOVED</span>';   // the same matter, over from Waiting On
  if (f === '新') return '<span class="st new">' + 'NEW!'.split('').map(c => `<i>${c}</i>`).join('') + '</span>';
  if (f === '更新') return '<span class="st upd">UPDATE</span>';
  if (q.urgency === 'high') return '<span class="st hot">URGENT</span>';
  if (q.due) return '<span class="st due">DEADLINE</span>';
  // how long it has been his, in days like Waiting On ("1d", "TODAY")
  if (!q.since) return '<span></span>';
  const n = waitDays(q);
  return `<span class="st age">${n ? `${n}<small>d</small>` : 'TODAY'}</span>`;
}
let sel = -1;   // selected request (hover); none at rest
// how long a request takes, as the run judges it - the game's Difficulty column
const EFFORT = { D: 'minutes', C: 'under an hour', B: 'a few hours', A: 'a day or more' };
function queue(V) {
  const done = V.done;   // like the game's list, every finished request stays at the bottom, greyed out
  const X = [0, 18, 6, 24, 12, 30, 16, 34];
  sel = Math.min(sel, Math.max(0, V.rest.length - 1));
  const rows = V.rest.map((q, i) => {
    const tag = q.url ? 'a' : 'div', who = names(q.who);
    return `<${tag} class="rq ${i === sel ? 'sel' : ''}" data-i="${i}" style="--i:${i};--x:${X[i % X.length]}px" ${linkOpen(q.url, who[0])}>
      ${stampOf(q)}
      <span class="rq-b"><span class="rq-t">${e(q.title)}</span>${q.reason ? `<span class="rq-r">${e(q.reason)}</span>` : ''}</span>
      ${q.why || tacticOf(q) ? `<span class="rq-end">${tacMark(q)}${q.why ? `<span class="rq-w">${e(q.why)}</span>` : ''}</span>` : '<span></span>'}
      ${EFFORT[q.effort] ? `<span class="rq-c" aria-label="Effort: ${EFFORT[q.effort]}">${q.effort}</span>` : '<span></span>'}
      <span class="rq-acts"><button class="rq-d" ${dismissAttrs(q)} title="Drop: not mine, or won't do" aria-label="Drop"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button><button class="rq-x" ${doneAttrs(q)} title="Done" aria-label="Mark done"><svg viewBox="0 0 12 12"><path d="M2 6.5l2.8 2.8L10 3.5"/></svg></button></span>
    </${tag}>`;
  }).join('');
  const doneRows = done.map((d, j) => {
    const tag = d.url ? 'a' : 'div';
    return `<${tag} class="rq done ${d.new ? 'fresh' : ''}" style="--i:${V.rest.length + j};--x:${X[(V.rest.length + j) % X.length]}px" ${linkOpen(d.url)}>
      ${d.dropped ? '<span class="st done dropped">DROPPED</span>' : '<span class="st done">DONE!</span>'}${d.note
        ? `<span class="rq-b"><span class="rq-t">${e(d.what)}</span><span class="rq-r">✓ ${e(d.note)}</span></span>`
        : `<span class="rq-t">${d.new ? '<span class="new-tag">NEW</span>' : ''}${e(d.what)}</span>`}<span class="rq-end"><span class="rq-w">${e(String(d.label || '').replace(/^(today|今天|手动)\s*·?\s*/i, ''))}</span>${d.key ? `<button class="rq-undo" data-restore="${e(d.key)}" aria-label="Undo">UNDO</button>` : ''}</span>
      ${EFFORT[d.effort] ? `<span class="rq-c" aria-label="Effort: ${EFFORT[d.effort]}">${d.effort}</span>` : ''}
    </${tag}>`;
  }).join('');
  const head = V.rest.length || !done.length ? `${collage('REQUESTS', 'sec-next', 'sm')}<span class="cnt">${V.rest.length}</span>` : `${collage('CLEARED', 'sec-done', 'sm')}<span class="cnt">${V.done.filter(d => !d.dropped).length}</span>`;
  // TACTICS sits on the list it orders, with how many orders are set
  const tac = `<button class="sec-tac" data-tactics title="Your rules for the ranking (T)">TACTICS <b>${(TACTICS.get().orders || []).length}</b></button>`;
  return `<section class="req"><h3 class="sec">${head}${tac}</h3>${rows}${doneRows}</section>`;
}

// Send calling card: the drafted nudge, printed on a calling postcard addressed to them. Same data-* contract as core's composer().
const postcard = (w, url, fresh) => `<div class="pc ${fresh ? 'fresh' : ''}" data-composer>
  <div class="pc-h"><span class="pc-t">${collage('CALLING CARD', 'pc|' + keyOf(w))}</span><span class="pc-to">TO: ${e(names(w.who).join(' · ').toUpperCase())}</span></div>
  <textarea spellcheck="false" aria-label="Drafted message — edit before sending">${e(w.nudge)}</textarea>
  <div class="pc-f"><button class="send" data-send data-url="${e(url)}"><span>Copy & open ${via(url)}</span></button><button class="cancel" data-pc-close><span>Cancel</span></button>
    <span class="pc-sign">— We will take your procrastination.</span></div>
</div>`;

// Waiting On as the game's IM inbox: one slanted bar per loop — who, what they owe, how long it's been quiet, a tag when
// it's time to chase. Clicking a bar opens it (openNudge, one at a time) on the last few messages; Send calling card then brings
// out the calling postcard with the drafted nudge (pcOpen).
const quietDays = w => {
  const last = [...(w.thread || []).map(m => m.at), w.last_activity, w.since].filter(Boolean).sort().pop();
  return last ? calDays({ since: last }) : 0;
};
const VIA = { mail: 'MAIL', teams: 'TEAMS', github: 'GITHUB' };
let pcOpen = '';   // whose calling postcard is out, inside the open bar
let shownOpen = '', shownPc = '';   // what the last paint showed: a chat or postcard animates in only the first time it's drawn
function targets(V) {
  const head = `<h3 class="sec">${collage('WAITING ON', 'sec-wait', 'sm')}<span class="cnt">${V.waiting.length}</span></h3>`;
  // the run's order: whoever is worth chasing first, then the longest wait; one bar per loop
  const seen = new Set(), items = V.ledger.flatMap(p => p.items).filter(w => !seen.has(keyOf(w)) && seen.add(keyOf(w)));
  if (!items.length) return `<section class="targets">${head}</section>`;   // nobody: the 0 in the heading says it
  const X = [0, 14, 4, 20, 8, 24, 12];
  const rows = items.map((w, i) => {
    const k = keyOf(w), open = openNudge === k;
    const who = names(w.who), off = names(w.not_waiting), n = quietDays(w), f = flagOf(w);
    // one status over the name, as in the game - the most pressing of CHASE (time to nudge), MOVED (over from Requests), NEW,
    // UPDATE - and the days beside it
    const status = w.nudge_now ? '<span class="tg hot">CHASE</span>' : w.moved ? '<span class="tg">MOVED</span>' : f === '新' ? '<span class="tg new">NEW</span>' : f === '更新' ? '<span class="tg">UPDATE</span>' : '';
    const tags = `${status}<span class="tg day">${n ? `${n}<small>d</small>` : 'TODAY'}</span>`;
    const thread = [...(w.thread || [])].sort((a, b) => String(a.at || '').localeCompare(String(b.at || '')));
    const speakers = [...new Set(thread.filter(m => m.from !== 'ME').map(m => String(m.from).toLowerCase()))], bar = [...who, ...off];
    const oneToOne = speakers.length === 1 && bar.length === 1 && speakers[0] === bar[0].toLowerCase();
    const mixed = new Set(thread.map(m => m.via).filter(Boolean)).size > 1;   // the loop runs across mail, Teams, GitHub
    const detail = !open ? '' : `<div class="ib-detail ${shownOpen !== k ? 'fresh' : ''}" style="--n:${thread.length}">
      ${thread.length ? thread.map((m, j) => {
          // a loop can span several people and chats: name whoever speaks, each time the speaker changes (not in a plain 1:1)
          const me = m.from === 'ME', prev = thread[j - 1];
          const named = !me && !oneToOne && m.from && m.from !== prev?.from;
          const via = mixed && m.via && (m.via !== prev?.via || m.from !== prev?.from) ? VIA[m.via] || m.via : '';   // where it was said, when that changes
          const hd = named || via ? `<div class="ib-hd ${me ? 'me' : ''}" style="--m:${j}">${named ? `<span class="ib-who">${e(m.from)}</span>` : ''}${via ? `<span class="ib-via">${e(via)}</span>` : ''}</div>` : '';
          return `${hd}<div class="ib-msg ${me ? 'me' : ''}" style="--m:${j}"><span>${e(m.text)}</span></div>`;
        }).join('')
        : w.quote ? `<p class="ib-quote">“${e(w.quote)}”</p>` : ''}
      ${w.nudge && pcOpen === k ? postcard(w, replyUrl(w), shownPc !== k) : ''}
      <div class="ib-foot">${w.nudge_now && w.why ? `<span class="ib-why">${e(w.why)}</span>` : ''}${w.nudge && pcOpen !== k ? `<button class="o-nudge" data-pc="${e(k)}">Send calling card</button>` : ''}<button class="o-done" ${doneAttrs({ ...w, what: `${who.join(', ')}: ${w.what}` })}>✓ Resolved</button>
        ${w.url && w.url !== replyUrl(w) ? `<a class="ib-link" ${linkOpen(w.url, who[0])}>Open</a>` : ''}</div>
    </div>`;
    return `<div class="ib ${open ? 'sel' : ''} ${w.nudge_now ? 'due' : ''}" style="--i:${i};--x:${X[i % X.length]}px">
      <div class="ib-tags">${tags}</div>
      <button class="ib-bar" data-nudge="${e(k)}" aria-expanded="${open}">
        <span class="av" aria-hidden="true">${e([...(who[0] || '?')][0].toUpperCase())}</span>
        <span class="ib-txt"><span class="ib-name">${e(who.join(' · '))}${off.map(n => ` · <span class="ib-off">${e(n)}</span>`).join('')}</span><span class="ib-what">${e(w.what)}</span></span>
      </button>${detail}
    </div>`;
  }).join('');
  return `<section class="targets">${head}<div class="phone-wrap"><div class="phone"><div class="phone-in">
    <span class="im-logo" aria-label="IM"><b>I</b><span>M</span></span>${rows}</div></div></div></section>`;
}

// PHAN-SITE: what's worth knowing today, every post shown. Gone when there's none.
// Reading one isn't finishing anything, so Got it keeps its own record (not tower:dismissed) and never lands in DONE!.
// A post read before comes back, flagged UPDATE, if something newer happens on it.
const READ = store('tower:read', true);
function phansite(V) {
  const R = READ.get();
  const posts = V.highlights.filter(h => !(keyOf(h) in R) || actAt(h) > R[keyOf(h)]);
  // nothing new, or all read: the heading stays with a 0, like Waiting On — gone would read as "didn't look"
  const head = `<h3 class="sec">${collage('PHAN-SITE', 'phan', 'sm')}<span class="cnt">${posts.length}</span></h3>`;
  if (!posts.length) return `<section class="phan-sec">${head}</section>`;
  return `<section class="phan-sec">${head}<div class="phan">${posts.map(h => {
    const f = keyOf(h) in R ? '更新' : flagOf(h);
    const who = plain(h.where) || SRC_NAME[h.source] || '';
    const title = who && h.title.startsWith(who) ? h.title.slice(who.length).trim() : h.title;   // "Acme: Acme Sprint…" reads twice
    const tag = h.url ? 'a' : 'div';
    return `<${tag} class="ph-post" ${linkOpen(h.url, who)}>
      <span>${f ? `<span class="ph-tags"><span class="tg ${f === '新' ? 'new' : ''}">${f === '新' ? 'NEW' : 'UPDATE'}</span></span>` : ''}<span class="ph-line">${who ? `<span class="ph-who">${e(who)}: </span>` : ''}${e(title)}</span>${h.detail ? `<span class="ph-d">${e(h.detail)}</span>` : ''}</span>
      <button class="ph-read" data-read="${e(keyOf(h))}" data-at="${e(actAt(h))}"><span>Got it</span></button></${tag}>`;
  }).join('')}</div></section>`;
}

// Looping motion (the rays, a throbbing tag) is set from the wall clock rather than started from zero, so a re-render
// or a reload picks each loop up exactly where it was: the rays never snap back.
const clock = () => `${-(Date.now() / 1000 % 86400).toFixed(3)}s`;
document.querySelector('.sun').style.setProperty('--t', clock());

// Where a link goes, said before the click: the app, and what it opens there.
function destOf(a) {
  const u = a.getAttribute('href') || '', who = a.dataset.who;
  if (/^msteams:/.test(u)) return `Teams${who ? ` · ${who}` : ''}`;
  let url;
  try { url = new URL(u); } catch { return ''; }
  const h = url.hostname.replace(/^www\./, ''), p = url.pathname;
  if (h === 'github.com') {
    const g = p.match(/\/(pull|issues)\/(\d+)/), r = p.match(/\/releases\/tag\/([^/]+)/);
    return g ? `GitHub · ${g[1] === 'pull' ? 'PR ' : ''}#${g[2]}` : r ? `GitHub · release ${r[1]}` : 'GitHub';
  }
  if (/^outlook\./.test(h)) {
    // Outlook opens an Inbox email itself; any other mail link opens a folder, and the prompt names it (render.py passes the names)
    const f = (B.mail_folders || {})[p.replace(/\/$/, '')];
    return `Outlook · ${/\/calendar/.test(p) ? 'calendar' : /\/id\//.test(p) ? 'email' : f ? (f === 'Inbox' ? f : `${f} folder`)
      : /sentitems/.test(p) ? 'Sent folder' : 'folder'}`;
  }
  if (h === 'dev.azure.com') return 'Azure DevOps';
  if (/zendesk\.com$/.test(h)) { const t = p.match(/tickets\/(\d+)/); return `Zendesk${t ? ` · ticket ${t[1]}` : ''}`; }
  if (/sharepoint\.com$/.test(h)) return 'SharePoint';
  return h;
}
const goChip = Object.assign(document.createElement('div'), { className: 'goto', hidden: true });
document.body.append(goChip);
// It shows only once the pointer rests on a link for half a second: sweeping down a list leaves the corner alone.
let goFor = null, goWait = 0;
const hideGo = () => { clearTimeout(goWait); goChip.hidden = true; goFor = null; };
document.addEventListener('mouseover', ev => {
  const a = ev.target.closest('#app a[href]');
  if (a === goFor) return;
  hideGo();
  const d = a && destOf(a);
  // a button that already names its app ("Reply to Alex in Teams") needs no prompt
  if (!d || (a.classList.contains('act') && a.textContent.toLowerCase().includes(d.split(' · ')[0].toLowerCase()))) return;
  goFor = a;
  goWait = setTimeout(() => {
    goChip.innerHTML = `<i>↗</i><span><small>Open in</small>${e(d)}</span>`;
    goChip.hidden = false; goChip.classList.remove('pop'); void goChip.offsetWidth; goChip.classList.add('pop');
  }, 500);
});
document.addEventListener('mouseout', ev => { if (!ev.relatedTarget) hideGo(); });
document.addEventListener('click', hideGo);

let firstPaint = true;
function render() {
  hideGo();
  const V = model();
  const app = document.getElementById('app');
  app.classList.toggle('intro', firstPaint && FRESH_RUN && !reduced);
  firstPaint = false;
  app.style.setProperty('--t', clock());
  app.innerHTML = `${banner(V)}${header(V)}
    <div class="grid"><div class="col-main">${card(V)}${queue(V)}</div><div class="col-side">${targets(V)}${phansite(V)}</div></div>`;
  shownOpen = openNudge; shownPc = pcOpen;

// Got it: the post slides away (no MISSION CLEAR — nothing was done) and is remembered with its activity time.
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-read]');
  if (!b) return;
  ev.preventDefault(); ev.stopPropagation();
  const R = READ.get(); R[b.dataset.read] = b.dataset.at; READ.set(R);
  const post = b.closest('.ph-post');
  if (reduced || !post) return render();
  post.classList.add('reading');
  setTimeout(render, 260);
});

// Hovering a request selects it, like moving the cursor in the game's list. Nothing is selected at rest: the pointer is the
// cursor here, and a row picked by default reads as special and covers the row under it.
function select(r) {
  const i = r ? +r.dataset.i : -1;
  if (i === sel) return;
  sel = i;
  document.querySelectorAll('.rq[data-i]').forEach(x => x.classList.toggle('sel', x === r));
  grow(r);
}
document.addEventListener('mouseover', ev => {
  const r = ev.target.closest('.rq[data-i]');
  // the gaps between rows keep the selection, so sweeping down the list doesn't flicker; a DONE! row or leaving the list clears it
  if (r || !ev.target.closest('.req') || ev.target.closest('.rq')) select(r);
});
document.addEventListener('mouseout', ev => { if (!ev.relatedTarget) select(null); });

// Rows keep their one-line height, so the selected one can open over the rows below it (see .rq.sel).
// On a narrow screen every row already shows its whole text.
const wide = matchMedia('(min-width: 601px)');
function grow(r) {
  if (!r || !wide.matches) return;
  const b = r.querySelector('.rq-b');
  r.style.setProperty('--full', `${Math.max(r.offsetHeight, b.offsetTop + b.offsetHeight + 8)}px`);
}
function lockRows() {
  const rows = [...document.querySelectorAll('.rq[data-i]')];
  const selected = rows.find(r => r.classList.contains('sel'));
  rows.forEach(r => { r.style.height = ''; r.classList.remove('sel'); });
  if (wide.matches) rows.forEach(r => { r.style.height = `${r.offsetHeight}px`; });
  selected?.classList.add('sel');
  grow(selected);
}
let relock = 0;
addEventListener('resize', () => { clearTimeout(relock); relock = setTimeout(lockRows, 150); });
document.fonts?.ready.then(lockRows);

// The keyboard, like the game's controller: ↑↓ move the cursor in a column, ←→ switch columns, Enter confirms, Space
// marks done, X drops it (not mine, or won't do), Esc backs out, R syncs, T opens the tactics. Enter on a Waiting On bar opens or closes the chat; ↓ then steps into its buttons,
// below it. Enter on the target steps into its buttons. In a row of buttons ←→ choose one and Enter presses it, like the
// game's submenus. Moving the cursor never opens or closes anything: only Enter and Esc do. The cursor and the prompts show only while the keyboard is in use: the
// mouse takes over again as soon as it moves. The left column is the target and the requests; the right, Waiting On and
// Phan-Site.
const keys = Object.assign(document.createElement('div'), { className: 'keys', hidden: true });
document.body.append(keys);
let kb = null;   // { col: 0 | 1, i, act } while the keyboard is in use; act: the chosen button, inside a submenu
const DN = '<kbd><svg width="10" height="6" viewBox="0 0 10 6"><path d="M5 6L0 0h10z"/></svg></kbd>';
const UD = '<kbd><svg width="10" height="14" viewBox="0 0 10 14"><path d="M5 0l5 6H0zM5 14L0 8h10z"/></svg></kbd>';
const LR = '<kbd><svg width="14" height="10" viewBox="0 0 14 10"><path d="M0 5l6-5v10zM14 5l-6 5V0z"/></svg></kbd>';
const acts = el => [...el.querySelectorAll(el.matches('.ib') ? '.ib-foot > button, .ib-foot > a' : '.acts > a, .composer-btns > button, .composer-btns > a')];
const slots = col => [...document.querySelectorAll(col ? '#app .ib, #app .ph-post' : '#app [data-card]:not(.calm), #app .rq[data-i]')];
function kbPaint(scroll) {
  document.querySelectorAll('#app .kb, #app .kb-act').forEach(x => x.classList.remove('kb', 'kb-act'));
  keys.hidden = true;
  if (!kb) return;
  if (!slots(kb.col).length) kb.col = 1 - kb.col;   // a column with nothing in it
  const list = slots(kb.col);
  if (!list.length) return;
  kb.i = Math.max(0, Math.min(kb.i, list.length - 1));
  const el = list[kb.i];
  if (el.matches('.rq')) select(el);   // a request: the game's own red cursor, as on hover
  else { select(null); el.classList.add('kb'); }
  if (kb.act != null) {   // inside the submenu: the chosen button, and the submenu's own prompts
    const list = acts(el);
    kb.act = list.length ? Math.max(0, Math.min(kb.act, list.length - 1)) : null;
    if (kb.act != null) {
      list[kb.act].classList.add('kb-act');
      if (scroll) list[kb.act].scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
      keys.innerHTML = `<span>${LR}Choose</span><span><kbd>⏎</kbd>Select</span><span><kbd>Esc</kbd>Back</span>`;
      keys.hidden = false;
      return;
    }
  }
  if (scroll) el.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
  const open = el.matches('.ib') && el.classList.contains('sel');
  const [enter, space] = el.querySelector('.pc') ? ['', '']   // writing the calling card: keys type, Esc puts it away
    : el.matches('.ib') ? [open ? 'Close' : 'Open', open ? 'Resolved' : '']
    : el.matches('.ph-post') ? ['Open', 'Got it'] : ['Open', 'Done'];
  const into = open && acts(el).length ? `<span>${DN}Buttons</span>` : '';
  const dismiss = el.matches('[data-card], .rq') ? '<span><kbd>X</kbd>Drop</span>' : '';
  keys.innerHTML = `<span>${UD}${LR}Move</span>${into}${enter ? `<span><kbd>⏎</kbd>${enter}</span>` : ''}${space ? `<span><kbd>Space</kbd>${space}</span>` : ''}${dismiss}<span><kbd>Esc</kbd>Back</span><span><kbd>R</kbd>Sync</span><span><kbd>T</kbd>Tactics</span>`;
  keys.hidden = false;
}
document.addEventListener('keydown', ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;   // the browser's own shortcuts
  if (!tactics.hidden) {                                 // the tactics sheet: keys type; Esc leaves the box, then the sheet
    if (ev.key === 'Escape') ev.target.closest?.('textarea') ? ev.target.blur() : closeTactics();
    return;
  }
  if (ev.target.closest?.('textarea, input')) {         // typing a nudge: Esc leaves the box, every other key types
    if (ev.key === 'Escape') ev.target.blur();
    return;
  }
  const k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
  if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' ', 'Escape', 'r', 't', 'x'].includes(k)) return;
  ev.preventDefault();
  hideGo();
  if (k === 'r') return document.querySelector('#app [data-refresh]:not([disabled])')?.click();
  if (k === 't') { const n = kb && slots(kb.col)[kb.i]?.querySelector('[data-tactics]')?.dataset.tactics; kb = null; kbPaint(false); return openTactics(Number(n) || 0); }
  if (!kb) { if (k !== 'Escape') { kb = { col: 0, i: 0 }; kbPaint(true); } return; }   // the first key only brings the cursor up (Esc never does)
  const el = slots(kb.col)[kb.i];
  const click = x => x?.click();
  if (el && kb.act != null && k !== ' ' && k !== 'x') {   // in a row of buttons
    const list = acts(el);
    if (k === 'ArrowLeft') kb.act = Math.max(0, kb.act - 1);
    else if (k === 'ArrowRight') kb.act = Math.min(list.length - 1, kb.act + 1);
    else if (k === 'Enter') { const b = list[kb.act]; kb.act = null; click(b); }
    else if (k === 'ArrowDown') { if (kb.i < slots(kb.col).length - 1) { kb.act = null; kb.i++; } }   // on to the next item, if there is one
    else kb.act = null;                                                   // ↑ or Esc: back up to the bar or the card
    return kbPaint(true);
  }
  if (k === 'ArrowUp') kb.i--;
  else if (k === 'ArrowDown') {
    if (el?.matches('.ib.sel') && acts(el).length) kb.act = 0;   // an open chat: down into its buttons
    else kb.i++;
  } else if (k === 'ArrowLeft' || k === 'ArrowRight') {
    const col = k === 'ArrowLeft' ? 0 : 1;
    if (col !== kb.col && slots(col).length) kb = { col, i: 0 };
  } else if (k === 'Escape') {
    // back out one step: the postcard, then the open chat, then the cursor itself
    if (document.querySelector('#app .pc')) click(document.querySelector('#app [data-pc-close]'));
    else if (document.querySelector('#app .ib.sel')) click(document.querySelector('#app .ib.sel [data-nudge]'));
    else { kb = null; select(null); }
  } else if (el && k === 'Enter') {
    // the target with one button presses it; with more, and a Waiting On bar, open the submenu of buttons
    if (el.matches('[data-card]')) { if (acts(el).length > 1) kb.act = 0; else click(acts(el)[0]); }
    else if (el.matches('.ib')) click(el.querySelector('[data-nudge]'));   // open or close the chat
    else if (el.matches('a')) click(el);
  } else if (el && k === ' ') {
    if (el.matches('[data-card]')) click(el.querySelector('.stamp'));
    else if (el.matches('.rq')) click(el.querySelector('.rq-x'));
    else if (el.matches('.ph-post')) click(el.querySelector('[data-read]'));
    else if (el.matches('.ib') && el.classList.contains('sel')) { kb.act = null; click(el.querySelector('.o-done')); }
  } else if (el && k === 'x') {
    kb.act = null;
    click(el.querySelector(el.matches('[data-card]') ? '.card-d' : '.rq-d'));
  }
  kbPaint(true);
});
document.addEventListener('mousemove', ev => {
  if (kb && Math.abs(ev.movementX) + Math.abs(ev.movementY) > 2) { kb = null; kbPaint(false); }
});

// Send calling card brings the postcard out of the open bar; its Cancel puts it away. Opening another bar starts without it.
document.addEventListener('click', ev => {
  if (ev.target.closest('[data-nudge]')) { pcOpen = ''; return; }   // core opens / closes the bar itself
  const t = ev.target.closest('[data-pc], [data-pc-close]');
  if (!t) return;
  ev.preventDefault();
  pcOpen = t.matches('[data-pc]') ? t.dataset.pc : '';
  render();
  if (pcOpen) document.querySelector('.pc textarea')?.focus();
});

// TACTICS: the user's standing orders for the judge, in their own words - what only they know, like which days go to
// which project. A sheet over the page (outside the re-render, so nothing repaints under the typing); saving starts a sync,
// so the new order shows straight away.
const tactics = Object.assign(document.createElement('div'), { className: 'tc-back', hidden: true });
document.body.append(tactics);
const tcRow = text => `<div class="tc-row"><textarea rows="1" spellcheck="false" aria-label="Tactic" placeholder="e.g. Tue/Wed: Project B work first">${e(text)}</textarea>
  <button class="tc-x" data-tc-del title="Remove" aria-label="Remove"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button></div>`;
function openTactics(n = 0) {   // n: the order to point at (1 for the first), from an item's mark
  const orders = TACTICS.get().orders || [];
  tactics.innerHTML = `<div class="tc" role="dialog" aria-modal="true" aria-label="Tactics">
    <div class="tc-h">${collage('TACTICS', 'tactics')}</div>
    <p class="tc-sub">Brief your Navigator on what only you know. Every sync plays by your rules.</p>
    <div class="tc-list">${(orders.length ? orders : ['']).map(tcRow).join('')}</div>
    <button class="tc-add" data-tc-add>+ New tactic</button>
    <div class="tc-f"><button class="cancel" data-tc-close><span>Cancel</span></button><button class="send" data-tc-save><span>Save & sync</span></button></div>
  </div>`;
  tactics.hidden = false; holding = true;
  tactics.querySelectorAll('textarea').forEach(fit);
  const row = tactics.querySelectorAll('.tc-row')[n - 1];
  row?.classList.add('hl');
  (row || tactics).querySelector('textarea').focus();
}
function closeTactics() { tactics.hidden = true; tactics.innerHTML = ''; holding = false; }
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tactics], [data-tc-add], [data-tc-del], [data-tc-save], [data-tc-close]');
  if (!t) { if (ev.target === tactics) closeTactics(); return; }   // a click beside the sheet puts it away
  ev.preventDefault();
  if (t.matches('[data-tactics]')) return openTactics(Number(t.dataset.tactics) || 0);
  if (t.matches('[data-tc-close]')) return closeTactics();
  if (t.matches('[data-tc-add]')) {
    tactics.querySelector('.tc-list').insertAdjacentHTML('beforeend', tcRow(''));
    return tactics.querySelector('.tc-row:last-child textarea').focus();
  }
  if (t.matches('[data-tc-del]')) return t.closest('.tc-row').remove();
  const orders = [...tactics.querySelectorAll('textarea')].map(x => x.value.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const changed = JSON.stringify(orders) !== JSON.stringify(TACTICS.get().orders || []);
  closeTactics();
  if (changed) { TACTICS.set({ orders }); document.querySelector('#app [data-refresh]:not([disabled])')?.click(); }
});

// Draft boxes grow with their text, so a drafted message is never cut off.
const fit = t => { t.style.height = 'auto'; t.style.height = `${t.scrollHeight + t.offsetHeight - t.clientHeight}px`; };
const fitAll = () => document.querySelectorAll('#app textarea').forEach(fit);
document.addEventListener('input', ev => { if (ev.target.matches?.('textarea')) fit(ev.target); });
document.fonts?.ready.then(fitAll);

// MISSION CLEAR: slash it, slam the stamp, fling it off — then core records the done and re-renders
// (a request then comes back at the bottom of the list, stamped DONE!). A drop plays the same with a black DROPPED stamp.
beforeDone = async el => {
  if (reduced) return;
  const host = el.closest('[data-card], .rq, .ib, .ph-post');
  if (!host) return;
  document.getElementById('app').classList.remove('intro');
  host.classList.add('clearing');
  // Angle the slash to the host's own shape so it cuts through the middle of a thin row as well as the big card:
  // it starts low on the left and ends high on the right, centred vertically. Capped at the card's 9°.
  const w = host.offsetWidth * 1.06, h = host.offsetHeight;
  const a = Math.min(9, Math.atan(h * .6 / w) * 180 / Math.PI);
  const top = h / 2 + w * Math.tan(a * Math.PI / 180) / 2;
  const drop = el.matches('[data-dismiss]');
  host.insertAdjacentHTML('beforeend', `<span class="slash${drop ? ' drop' : ''}" style="--a:-${a.toFixed(2)}deg;--top:${top.toFixed(0)}px"></span>${drop ? '<span class="clear-stamp drop">DROPPED</span>' : '<span class="clear-stamp">MISSION CLEAR</span>'}`);
  await new Promise(r => setTimeout(r, 960));
};

// Copy & open: once the message is on the clipboard the card is sent, and flies off.
document.addEventListener('click', ev => {
  const s = ev.target.closest('.pc [data-send]');
  if (!s || reduced) return;
  setTimeout(() => { if (/^Copied/.test(s.textContent)) s.closest('.pc')?.classList.add('sent'); }, 150);
});

start(render);
</script>
</body>
</html>

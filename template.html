<style>
  :root {
    --red: #e60012; --red-2: #b8000f; --ink: #0b0b0b; --paper: #fff; --blue: #1fb4ff;
    --sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", -apple-system, sans-serif;
    --anton: Anton, Impact, "Arial Narrow", "Noto Sans SC", "PingFang SC", sans-serif;
    --serif: "Noto Serif SC", "Songti SC", serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { background: var(--red); }
  body { position: relative; min-height: 100vh; margin: 0; background: var(--red); color: #fff; font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- persistent background (outside the re-render) ---------- */
  /* the rays burst from behind the date and scroll with the page; render() puts their centre on the date */
  .sun { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .sun .rays { position: absolute; left: var(--sx, 140px); top: var(--sy, 110px); width: 280vmax; height: 280vmax; margin: -140vmax 0 0 -140vmax;
    background: repeating-conic-gradient(from 0deg, rgba(0,0,0,.2) 0deg 6deg, transparent 6deg 17deg);
    animation: spin 200s linear var(--t, 0s) infinite; will-change: transform; }
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg .slab { position: absolute; left: -20vw; bottom: -30vh; width: 85vw; height: 70vh; background: var(--red-2); transform: rotate(-14deg); }
  .bg .stripe { position: absolute; left: -10vw; bottom: 34vh; width: 130vw; height: 10px; background: #000; transform: rotate(-14deg); opacity: .85; }
  .bg .stripe.w { bottom: calc(34vh - 18px); height: 3px; background: #fff; opacity: .7; }
  .bg .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.36) 1.3px, transparent 1.9px); background-size: 9px 9px;
    -webkit-mask-image: linear-gradient(118deg, transparent 35%, #000 80%); mask-image: linear-gradient(118deg, transparent 35%, #000 80%); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* where a link goes, on hover — the game's button prompt, in its corner: bottom right, clear of the content */
  /* keyboard: the cursor, and the game's button prompts in the corner (only while the keyboard is in use) */
  .card.kb { outline: 4px solid var(--blue); outline-offset: 7px; }
  .ib.kb .ib-bar::after { background: var(--red); }
  .ib.kb .ib-bar::before { background: var(--blue); transform: translate(5px, 4px); }
  .ph-post.kb { outline: 3px solid var(--blue); outline-offset: 4px; }
  .ph-post.kb .ph-read { background: #fff; color: #000; }
  .kb-act { outline: 3px solid var(--blue); outline-offset: 3px; }
  .keys { position: fixed; z-index: 60; right: 24px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 16px;
    padding: 8px 18px; background: #000; color: #fff; font: 700 13px/1 var(--sans); transform: skewX(-10deg); box-shadow: 5px 5px 0 var(--red); }
  .keys[hidden] { display: none; }
  .keys > span { display: flex; align-items: center; gap: 7px; transform: skewX(10deg); white-space: nowrap; }
  .keys kbd { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; height: 20px; min-width: 22px; padding: 0 6px;
    background: #fff; color: #000; font: 14px/1 var(--anton); letter-spacing: .02em; }
  .keys kbd svg { display: block; fill: currentColor; }   /* arrows drawn, not from a fallback font: the same triangle, turned */
  @media (max-width: 600px) { .keys { display: none; } }   /* a phone has no keyboard */
  .goto { position: fixed; z-index: 50; right: 28px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); pointer-events: none;
    display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 56px); padding: 6px 18px 6px 8px;
    background: #000; color: #fff; font: 900 15px/1.5 var(--sans); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
    transform: skewX(-12deg); box-shadow: 0 0 0 3px #fff, 7px 7px 0 var(--blue); }
  .goto[hidden] { display: none; }
  .goto i { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #000; font-style: normal; font-size: 14px; transform: skewX(12deg); }
  .goto span { overflow: hidden; text-overflow: ellipsis; }
  .goto small { font-size: 12px; color: #bbb; margin-right: 6px; }
  .goto.pop { animation: goIn .14s cubic-bezier(.2,1.4,.4,1); }
  @keyframes goIn { from { opacity: 0; transform: skewX(-12deg) translateX(48px); } }

  .wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 26px 36px 90px; }

  /* ---------- ransom-note collage: CJK one glyph per scrap, a Latin word or a number stays one scrap ---------- */
  .ransom { display: inline; line-height: 1.45; }
  .rn { display: inline-block; padding: .04em .14em .02em; margin: 0 .03em .14em; line-height: 1.12;
    transform: translateY(var(--y)) rotate(var(--r)) scale(var(--s)); clip-path: var(--clip); }
  .rn.w { background: #e8dec3; color: #000; box-shadow: inset 0 0 0 2px #000; }
  .rn.b { background: #000; color: #fff; }
  .rn.p { background: #fff; color: #000; box-shadow: inset 0 0 0 2px #000; }
  .f-serif { font-family: var(--serif); font-weight: 900; }
  .f-kuai  { font-family: "ZCOOL QingKe HuangYou", "Noto Sans SC", "PingFang SC", sans-serif; font-weight: 400; }
  .f-sans  { font-family: var(--sans); font-weight: 900; }
  .f-anton { font-family: var(--anton); font-weight: 400; letter-spacing: .02em; }
  .rn-gap { display: inline-block; width: .35em; }
  .rn-word { display: inline-block; white-space: nowrap; }
  .ransom.sm { font-size: 22px; }

  /* ---------- failed-source warning ---------- */
  .alert { position: relative; display: flex; align-items: center; gap: 16px 20px; flex-wrap: wrap; margin: 0 -60px 34px; padding: 14px 60px;
    background: #000; color: #fff; transform: rotate(-1.4deg); border-top: 5px solid #fff; border-bottom: 5px solid #fff; box-shadow: 0 12px 0 rgba(0,0,0,.35); }
  .alert-k { display: inline-block; background: var(--red); color: #fff; font: 900 28px/1.2 var(--sans); padding: 2px 16px; transform: skewX(-14deg); animation: throb 1.1s ease-in-out var(--t, 0s) infinite; }
  .alert-t { font: 900 22px/1.3 var(--sans); }
  .alert-t { display: flex; flex-wrap: wrap; gap: 4px 28px; }
  .alert-i { display: inline-block; }   /* a source and its button stay on one line */
  .alert-go { margin-left: 8px; padding: 2px 14px; border: 0; background: #fff; color: #000; font: 900 15px/1.5 var(--sans); letter-spacing: .06em;
    vertical-align: 3px; transform: skewX(-12deg); box-shadow: 4px 4px 0 var(--red); cursor: pointer; }
  .alert-go:hover:not(:disabled) { background: var(--red); color: #fff; box-shadow: 4px 4px 0 #fff; }
  .alert-go:disabled { background: #333; color: #fff; box-shadow: none; cursor: default; }
  @keyframes throb { 50% { background: #fff; color: var(--red); } }

  /* ---------- header: the field HUD (top-left) + the objective tracker (top-right) ---------- */
  header.top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: start; margin-bottom: 26px; }
  .hud { cursor: default; }
  .hud-date { position: relative; display: inline-flex; align-items: flex-start; padding: 2px 58px 22px 8px; margin-left: 40px; }
  .hud-back { position: absolute; inset: 8px 50px 12px -8px; background: #fff; transform: rotate(-4deg);
    clip-path: polygon(0 16%, 34% 3%, 58% 10%, 100% 0, 94% 52%, 100% 100%, 62% 90%, 30% 100%, 4% 86%); }
  .hud-back::after { content: ""; position: absolute; inset: 5px; background: #000; clip-path: inherit; }
  .hud-date .m { position: relative; font: 50px/1 var(--anton); color: #fff; -webkit-text-stroke: 5px #000; paint-order: stroke fill; transform: rotate(-16deg) translateY(6px); margin-right: 4px; }
  .hud-date .sl { position: relative; width: 10px; height: 54px; margin: 30px 6px 0 -2px; background: #fff; box-shadow: 0 0 0 3px #000; transform: skewX(-42deg); }   /* the slash between month and day */
  .hud-date .d { position: relative; display: inline-flex; }
  .hud-date .d i { font: 110px/.9 var(--anton); font-style: normal; paint-order: stroke fill; }
  .hud-date .d i:nth-child(1) { color: #fff; -webkit-text-stroke: 6px #000; transform: rotate(-7deg) translateY(3px); }
  .hud-date .d i:nth-child(2) { color: #000; -webkit-text-stroke: 6px #fff; transform: rotate(5deg) translateY(14px); margin-left: -5px; }
  .hud-date .wd { position: absolute; right: -10px; bottom: 4px; background: #fff; color: #000; font: 30px/1 var(--anton); padding: 3px 11px 1px;
    transform: rotate(-10deg) skewX(-10deg); box-shadow: 4px 4px 0 #000; }
  .hud-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 4px; }
  .hud-row > :not(.tod) { top: 6px; }   /* the sync line sits a little below the time of day */
  .tod { font: 900 28px/1.02 var(--sans); color: #fff; -webkit-text-stroke: 6px #000; paint-order: stroke fill; transform: translateY(-6px) rotate(-16deg); transform-origin: right top; }   /* under the date's left, as in the game: tilted about its top-right end so that end stays below the weekday */
  .tod span { display: block; } .tod span + span { margin-left: 1em; }
  .tod { position: relative; }
  .tod.fresh > span { animation: todIn .42s .16s cubic-bezier(.2,1.6,.4,1) both; }
  .tod.fresh::after { content: ""; position: absolute; left: -14%; right: -14%; top: 46%; height: 6px; background: #fff; box-shadow: 0 0 0 3px #000;
    transform: rotate(-6deg) scaleX(0); transform-origin: left center; animation: cut .36s cubic-bezier(.6,0,.4,1) forwards; }
  @keyframes todIn { from { opacity: 0; transform: rotate(-18deg) scale(1.9); } }
  @keyframes cut { 45% { transform: rotate(-6deg) scaleX(1); opacity: 1; } 100% { transform: rotate(-6deg) scaleX(1); opacity: 0; } }
  .hud-sync { position: relative; overflow: hidden; isolation: isolate; margin-left: 16px; background: #000; color: #fff; font-weight: 700; font-size: 14px; padding: 1px 12px; transform: skewX(-12deg); }
  .hud-sync.failed { background: #fff; color: var(--red); }
  .hud-go { position: relative; padding: 1px 10px; border: 0; background: #fff; color: #000; font: 900 12px/1.6 var(--sans); letter-spacing: .08em; white-space: nowrap;
    transform: skewX(-12deg); box-shadow: 3px 3px 0 #000; cursor: pointer; }
  .hud-go:hover:not(:disabled) { background: #000; color: #fff; box-shadow: 3px 3px 0 var(--blue); }
  .hud-go:disabled { opacity: .45; box-shadow: none; cursor: default; }
  .hud-sync.syncing::before { content: ""; position: absolute; z-index: -1; top: -2px; bottom: -2px; left: 0; width: 34%; background: var(--red);
    transform: translateX(-120%) skewX(-24deg); animation: sweep 1.3s cubic-bezier(.65,0,.35,1) var(--t, 0s) infinite; }
  @keyframes sweep { 70%, 100% { transform: translateX(330%) skewX(-24deg); } }


  /* the objective tracker: "Days until Expulsion: 5 / Steal Kamoshida's heart / Send the calling card" */
  .trk { justify-self: end; display: grid; justify-items: end; max-width: 560px; margin-top: 8px; transform: rotate(-2deg); }
  .trk:hover .trk-bar > span { background: #ff1f2f; }
  .trk-top { display: flex; align-items: flex-end; gap: 10px; max-width: 100%; }
  .trk-k { min-width: 0; text-align: right; font: 900 30px/1.05 var(--sans); color: var(--red); -webkit-text-stroke: 7px #000; paint-order: stroke fill; transform: skewX(-8deg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 4px; }
  .trk-k small { display: block; font-size: 20px; }
  .trk-n { flex: none; display: grid; place-items: center; min-width: 64px; height: 70px; padding: 0 10px; background: #fff; color: #000; font: 64px/1 var(--anton);
    box-shadow: 0 0 0 5px #000; transform: rotate(4deg); margin-bottom: -18px; z-index: 1; }
  .trk-n.today { font: 900 36px/1 var(--sans); }
  .trk-bar { position: relative; max-width: 100%; margin-top: 12px; padding: 4px; background: #000; clip-path: polygon(3% 0, 100% 6%, 98% 100%, 0 92%); }
  .trk-bar > span { display: block; padding: 4px 34px 5px 40px; background: var(--red); color: #000; font: 900 20px/1.3 var(--serif);
    clip-path: polygon(3% 0, 100% 6%, 98% 100%, 0 92%); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .1s; }

  /* ---------- layout ---------- */
  .grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 44px; align-items: start; }
  .sec { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-weight: 400; }
  .sec .cnt { display: inline-grid; place-items: center; min-width: 32px; height: 32px; padding: 0 6px; background: #fff; color: #000; font: 20px/1 var(--anton); border-radius: 50%; box-shadow: 3px 3px 0 #000; }

  /* ---------- the target (focus): drawn like a calling card, but named for what it is — the game's calling card is sent to
     someone to make them act, which here is Waiting On's "Send calling card" ---------- */
  .card { position: relative; margin: 6px 12px 58px 0; padding: 22px 28px 30px; background: var(--paper); color: var(--ink); border: 4px solid #000;
    transform: rotate(-1.4deg); box-shadow: 14px 14px 0 #000; }
  .card::before { content: ""; position: absolute; top: -4px; right: -4px; width: 104px; height: 104px; background: var(--red); clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .card::after { content: ""; position: absolute; top: -4px; right: -4px; width: 150px; height: 150px; pointer-events: none;
    background-image: radial-gradient(#000 1.2px, transparent 1.7px); background-size: 7px 7px; clip-path: polygon(0 0, 100% 0, 100% 100%); opacity: .18; }
  .card .no { position: absolute; top: 4px; right: 10px; font: 30px/1 var(--anton); color: #fff; z-index: 1; }
  .card .no.eff { top: 2px; right: 14px; font-size: 50px; -webkit-text-stroke: 3px #000; paint-order: stroke fill; transform: rotate(-6deg); }
  .card-kicker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-right: 70px; }
  .ribbon { display: inline-block; background: #000; color: #fff; font-weight: 900; padding: 2px 14px; transform: skewX(-14deg); letter-spacing: .08em; }
  .why { display: inline-block; background: var(--red); color: #fff; font-weight: 900; padding: 2px 12px; transform: skewX(-14deg); }
  .why.hot { animation: throb 1.1s ease-in-out var(--t, 0s) infinite; box-shadow: 0 0 0 2px #000; }
  .card-title { margin: 16px 0 12px; font-size: clamp(26px, 3vw, 42px); font-weight: 400; line-height: 1.4; }
  .card-title a:hover .rn { box-shadow: inset 0 0 0 2px #000, 4px 4px 0 var(--blue); }
  .reason { margin: 0; max-width: 38em; padding-left: 14px; border-left: 7px solid var(--red); font: 500 17px/1.6 var(--sans); color: #111; }
  .acts, .card .composer-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; padding-right: 120px; }
  .act, .send, .cancel { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border: 0; background: #000; color: #fff; font-weight: 900; font-size: 15px;
    transform: skewX(-12deg); transition: transform .12s cubic-bezier(.3,1.8,.5,1), box-shadow .12s; }
  .act > span, .send > span, .cancel > span { display: inline-block; transform: skewX(12deg); }
  .act.primary, .send { background: var(--red); box-shadow: 4px 4px 0 #000; }
  .act b { background: #fff; color: #000; font-size: 11px; padding: 0 5px; letter-spacing: .1em; }
  .act:hover, .send:hover, .cancel:hover { transform: skewX(-12deg) scale(1.07); box-shadow: 6px 6px 0 var(--blue); }
  .stamp { position: absolute; right: 26px; bottom: -40px; width: 100px; height: 100px; padding: 0; border-radius: 50%; display: grid; place-content: center; gap: 0;
    background: #fff; color: var(--red); border: 5px solid var(--red); box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 6px var(--red), 5px 5px 0 #000;
    transform: rotate(-14deg); transition: transform .14s cubic-bezier(.3,1.8,.5,1), background .1s, color .1s; z-index: 2; }
  .stamp .st-top { font: 13px/1 var(--anton); letter-spacing: .14em; }
  .stamp .st-mid { font: 32px/1.05 var(--anton); letter-spacing: .03em; }
  .stamp:hover { transform: rotate(-6deg) scale(1.1); background: var(--red); color: #fff; }
  .card.calm .card-title { color: #000; }

  /* composer (the top card's nudge draft) */
  .composer textarea { display: block; width: 100%; min-height: 70px; padding: 10px 12px; border: 3px solid #000; border-radius: 0; resize: none; overflow: hidden;
    background: #fffdf4; color: #000; font: 500 15px/1.55 var(--sans); box-shadow: 6px 6px 0 var(--red); }
  .composer textarea:focus { outline: none; box-shadow: 6px 6px 0 var(--blue); }
  .composer-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .card .composer { margin-top: 18px; }

  /* ---------- queue: the REQUEST list — status stamp · request · client; done requests stay, stamped DONE! ---------- */
  .req { margin-top: 8px; }
  .rq { position: relative; display: grid; grid-template-columns: 80px minmax(0, 1fr) auto 64px; align-items: center; gap: 12px;
    min-height: 56px; margin: 0 0 8px var(--x); padding: 6px 16px 6px 6px; color: #fff; transition: transform .14s cubic-bezier(.3,1.7,.5,1); }
  .rq > * { position: relative; z-index: 2; }
  /* the slanted bar is only paint: the pointer goes by the row's own box, selected or not. A bar that took the pointer when
     at rest but not when selected made its corner, where it reaches into the next row, flip between the two rows. */
  .rq::before { content: ""; position: absolute; inset: 0; z-index: 1; background: #0b0b0b; transform: skewX(-14deg); box-shadow: 6px 6px 0 rgba(0,0,0,.3); pointer-events: none; }
  .rq.sel { transform: scale(1.03); }
  .rq.sel::before { background: var(--red); box-shadow: 0 0 0 3px #000, 10px 7px 0 3px var(--blue); }
  .st { justify-self: center; white-space: nowrap; transform: rotate(-7deg); }
  .st.new { font: 26px/1 var(--anton); letter-spacing: .02em; }
  .st.new i { display: inline-block; padding: 0 .06em; font-style: normal; }
  .st.new i:nth-child(odd) { background: #fff; color: var(--red); } .st.new i:nth-child(even) { background: #000; color: #fff; box-shadow: 0 0 0 2px #fff; }
  .st.hot { background: #fff; color: var(--red); }
  .st.upd { color: #fff; border: 2px solid #fff; }
  .st.due { background: #000; color: #fff; box-shadow: 0 0 0 2px #fff; }
  .st.hot, .st.upd, .st.due { font: 17px/1.3 var(--anton); letter-spacing: .03em; padding: 1px 6px; }   /* DEADLINE fits the 80px column */
  .st.age { color: rgba(255,255,255,.75); font: 22px/1 var(--anton); letter-spacing: .02em; }
  .st.age small { font: 900 13px/1 var(--sans); margin-left: 2px; }
  .rq.sel .st.hot { background: #000; color: #fff; }
  .st.done { color: #9a9a9a; font: 30px/1 var(--anton); letter-spacing: .01em; }
  .rq-t { display: block; min-width: 0; font: 700 17px/1.35 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rq-b { min-width: 0; }
  .rq-r { display: block; margin-top: 1px; font-size: 13px; color: rgba(255,255,255,.66); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rq.sel .rq-r { color: rgba(255,255,255,.92); }
  /* selected: the whole title and reason. The row keeps its height (lockRows) and the text spills over the rows below,
     on its own background - pushing them down would move the list under the pointer and change the selection */
  .rq.sel { z-index: 3; }
  .rq.sel .rq-b { align-self: start; }
  .rq.sel .rq-t, .rq.sel .rq-r { white-space: normal; }
  .rq.sel::before { bottom: auto; height: var(--full, 100%); }
  .rq.sel .rq-b { pointer-events: none; }   /* the text that spills over doesn't take the pointer: the row under it can still be selected */
  .rq-w { padding: 1px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; border: 2px solid rgba(255,255,255,.55); transform: skewX(-12deg); }
  .rq.sel .rq-w { background: #000; border-color: #000; }
  .rq-c { grid-column: 4; grid-row: 1; justify-self: center; font: 44px/1 var(--anton); color: #fff; -webkit-text-stroke: 3px #000; paint-order: stroke fill; transform: rotate(-6deg); }
  /* A request's buttons - ✕ drop, ✓ done - show on the row under the mouse, over its difficulty letter, the way a mail list
     swaps a row's date for its buttons. At rest the row reads like the game's list: stamp, title, difficulty. */
  /* in the letter's own grid cell, on top of it: centred exactly as the letter is, also when the row opens up */
  .rq .rq-acts { grid-column: 4; grid-row: 1; justify-self: center; display: flex; align-items: center; gap: 8px;
    opacity: 0; pointer-events: none; transition: opacity .1s; }
  .rq.sel .rq-acts, .rq .rq-acts:focus-within { opacity: 1; pointer-events: auto; }   /* whenever the row is selected */
  .rq.sel .rq-c { opacity: 0; }
  /* the two are the same circle; only the mark differs, and ✓ - the one used most - sits last */
  .rq-x, .rq-d { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 2px solid #fff; border-radius: 50%;
    background: transparent; color: #fff; transition: transform .12s; }
  .rq-x svg, .rq-d svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .rq-x:hover { background: #fff; color: #000; transform: scale(1.15) rotate(-10deg); }
  .rq-d:hover { background: #000; transform: scale(1.15) rotate(-10deg); }
  /* the target's Drop: the same ✕ circle as a request's, beside the TAKE IT DONE stamp */
  .card-d { margin-left: auto; align-self: center; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 2px solid #000; border-radius: 50%;
    background: #fff; color: #000; transition: transform .12s; }
  .card-d svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .card-d:hover, .card-d:focus-visible { background: #000; color: #fff; transform: scale(1.15) rotate(-10deg); }
  .rq.done .st.dropped { font-size: 17px; }   /* DROPPED: left the list by the user's decision, not done */
  .rq.done { min-height: 40px; margin-bottom: 5px; padding-block: 2px; }
  .rq.done::before { background: rgba(10,10,10,.72); box-shadow: none; }
  .rq.done .st.done { font-size: 22px; }
  .rq.done .rq-t { color: #9a9a9a; font-weight: 500; font-size: 15px; }
  .rq.done.fresh .rq-t { color: #fff; }
  .rq.done .rq-r { color: #8a8a8a; font-size: 12.5px; }   /* what the run found actually happened, under the user's own click */
  .new-tag { display: inline-block; margin-right: 10px; padding: 0 6px; background: #fff; color: var(--red); font: 14px/1.3 var(--anton); letter-spacing: .04em; vertical-align: 1px; box-shadow: 0 0 0 2px #000; transform: rotate(-4deg); }
  .rq.done .rq-w { border: 0; color: #8a8a8a; padding: 0; transform: none; font-weight: 500; }
  .rq-end { display: flex; align-items: center; gap: 12px; }
  .rq.done .rq-c { color: #8a8a8a; -webkit-text-stroke: 0; font-size: 32px; }
  .rq-undo { white-space: nowrap; padding: 1px 10px; border: 0; background: #fff; color: #000; font-size: 12px; font-weight: 900; transform: skewX(-12deg); }

  /* flags */
  .burst { position: relative; display: inline-grid; place-items: center; width: 54px; height: 32px; margin: -6px 0 -6px 10px; vertical-align: middle; background: #fff;
    clip-path: polygon(50% 0, 60% 22%, 86% 6%, 80% 34%, 100% 44%, 80% 60%, 92% 92%, 62% 78%, 50% 100%, 38% 78%, 8% 92%, 20% 60%, 0 44%, 20% 34%, 14% 6%, 40% 22%);
    transform: rotate(-10deg); animation: wobble 1.6s ease-in-out var(--t, 0s) infinite; }
  .burst::before { content: ""; position: absolute; inset: 3px; background: var(--red); clip-path: inherit; }
  .burst i { position: relative; font: 12px/1 var(--anton); font-style: normal; color: #fff; letter-spacing: .04em; }
  @keyframes wobble { 50% { transform: rotate(-4deg) scale(1.08); } }
  .tag-upd { display: inline-block; margin-left: 8px; padding: 0 7px; background: #fff; color: #000; font-size: 11px; font-weight: 900; line-height: 18px; vertical-align: 2px; transform: skewX(-12deg); box-shadow: 0 0 0 2px #000; }

  /* ---------- Waiting On: the game's IM inbox — a phone (white jagged frame, dark-red screen) holding one slanted bar per loop.
     Opening a bar shows the conversation on white paper with the calling postcard ready underneath. ---------- */
  .phone-wrap { filter: drop-shadow(10px 10px 0 rgba(0,0,0,.35)); transform: rotate(1.2deg); }
  .phone { padding: 10px; background: #fff; clip-path: polygon(1.5% 0, 100% .8%, 98.5% 100%, 0 99.2%); }
  .phone-in { padding: 14px 18px 18px 14px; background: #a8000e; clip-path: polygon(0 .6%, 99.4% 0, 100% 99.4%, .8% 100%); }
  .im-logo { display: inline-flex; align-items: stretch; margin: 0 0 16px; font: 30px/1 var(--anton); transform: rotate(-4deg); box-shadow: 4px 4px 0 #000; }
  .im-logo b { padding: 2px 6px 0; background: #fff; color: var(--red); font-weight: 400; }
  .im-logo span { padding: 2px 8px 0; background: #000; color: #fff; }
  .ib { position: relative; margin: 0 0 12px var(--x); }
  /* the little tags above a bar, like the game's HOLD / NEW and the date */
  .ib-tags { position: relative; z-index: 3; display: flex; gap: 5px; margin: 0 0 -3px 58px; transform: rotate(-3deg); transform-origin: left bottom; }
  .tg { display: inline-block; padding: 1px 8px 0; background: #fff; color: #000; font: 900 13px/1.45 var(--sans); box-shadow: 0 0 0 2px #000; }
  .tg.hot { background: var(--red); color: #fff; box-shadow: 0 0 0 2px #fff, 3px 3px 0 2px #000; }
  .tg.new { color: var(--red); font: 15px/1.25 var(--anton); letter-spacing: .04em; }
  .tg.day { font: 17px/1.15 var(--anton); letter-spacing: .02em; }
  .tg.day small { margin-left: 1px; color: var(--red); font: 900 11px/1 var(--sans); }
  /* the bar: black, tapering to the right; the open one, and the one under the pointer, is red - never one by default,
     which would read as a warning like CHASE */
  .ib-bar { position: relative; display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 58px; padding: 6px 34px 6px 2px; border: 0; background: none; color: #fff; text-align: left; }
  .ib-bar::before, .ib-bar::after { content: ""; position: absolute; clip-path: polygon(0 0, 100% 0, 93% 100%, 0 100%); }
  .ib-bar::before { inset: 3px -3px 3px 23px; background: #000; }
  .ib-bar::after { inset: 6px 0 6px 26px; background: #0b0b0b; transition: background .1s; }
  .ib-bar > * { position: relative; z-index: 1; }
  .ib.sel .ib-bar::after, .ib-bar:hover::after { background: var(--red); }
  .ib-bar .av { flex: none; width: 48px; height: 48px; display: grid; place-items: center; background: #fff; color: #000; font: 28px/1 var(--anton); box-shadow: 0 0 0 3px #000; transform: rotate(-5deg); }
  .ib-txt { min-width: 0; display: grid; }
  .ib-name { font: 17px/1.1 var(--anton); letter-spacing: .04em; text-transform: uppercase; opacity: .8; }
  .ib-off { opacity: .45; }   /* in the loop, but not waited on any more: delivered, or passed it on */
  .ib-what { font: 700 15.5px/1.35 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib-bar[aria-expanded="true"] .ib-what { white-space: normal; }   /* an open chat shows what it's about in full */
  /* opened: the conversation, then the calling postcard, then done */
  .ib-detail { position: relative; margin: 8px 12px 6px 30px; padding: 14px 16px 14px; background: #fff; color: #000; transform: rotate(-.8deg);
    box-shadow: 0 0 0 3px #000, 7px 7px 0 3px rgba(0,0,0,.3); }
  .ib-detail.fresh { animation: ibIn .2s cubic-bezier(.2,1.4,.4,1) both; }
  .ib-detail.fresh .ib-msg { animation: msgIn .24s cubic-bezier(.2,1.6,.4,1) both; animation-delay: calc(.12s + var(--m) * .11s); }
  .ib-detail.fresh .ib-foot, .ib-detail.fresh .ib-quote { animation: msgIn .2s ease-out both; animation-delay: calc(.12s + var(--n, 0) * .11s); }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(.7); } }
  @keyframes ibIn { from { opacity: 0; transform: translateY(-10px) rotate(-3deg); } }
  .ib-msg { width: fit-content; max-width: 86%; margin: 0 0 8px; padding: 2px; background: #000; clip-path: polygon(0 8%, 100% 0, 98% 100%, 2% 92%); }
  .ib-msg > span { display: block; padding: 6px 12px 7px; background: #000; color: #fff; font: 700 14px/1.5 var(--sans); clip-path: polygon(0 8%, 100% 0, 98% 100%, 2% 92%); }
  .ib-msg { transform-origin: left bottom; }
  .ib-msg.me { margin-left: auto; transform-origin: right bottom; }
  .ib-msg.me > span { background: #fff; color: #000; }
  .ib-hd { display: flex; align-items: center; gap: 6px; margin: 2px 0 2px 6px; transform: rotate(-2deg); }
  .ib-hd.me { justify-content: flex-end; margin: 2px 6px 2px 0; }
  .ib-who { padding: 1px 7px 0; background: var(--red); color: #fff; font: 13px/1.35 var(--anton); letter-spacing: .06em; text-transform: uppercase; }
  .ib-via { padding: 1px 6px 0; background: #fff; color: #000; font: 11px/1.45 var(--anton); letter-spacing: .08em; box-shadow: 0 0 0 1.5px #000; }   /* MAIL / TEAMS: where it was said */
  .ib-detail.fresh .ib-hd { animation: msgIn .24s cubic-bezier(.2,1.6,.4,1) both; animation-delay: calc(.12s + var(--m) * .11s); }
  .ib-quote { margin: 0 0 8px; color: #555; font-size: 14px; font-style: italic; }
  .ib-detail .pc { margin: 12px 0 4px; }
  .ib-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; }
  .ib-why { flex-basis: 100%; margin-bottom: -4px; color: var(--red); font: 800 13px/1.3 var(--sans); }   /* why it's time to chase */
  .ib-link { font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .ib-link:hover { color: var(--red); }
  .o-nudge { padding: 3px 14px; border: 0; background: var(--red); color: #fff; font-size: 13px; font-weight: 900; box-shadow: 3px 3px 0 #000; transform: skewX(-12deg);
    transition: transform .12s cubic-bezier(.3,1.8,.5,1), box-shadow .12s; }
  .o-nudge:hover { transform: skewX(-12deg) scale(1.08); box-shadow: 4px 4px 0 var(--blue); }
  .o-done { padding: 3px 14px; border: 0; background: #fff; color: #000; font-size: 13px; font-weight: 900; box-shadow: inset 0 0 0 2px #000; transform: skewX(-12deg);
    transition: transform .12s cubic-bezier(.3,1.8,.5,1), box-shadow .12s; }
  .o-done:hover { transform: skewX(-12deg) scale(1.08); box-shadow: inset 0 0 0 2px #000, 4px 4px 0 var(--blue); }
  /* Send calling card opens a calling postcard (P5R lets you mail a fake calling card to someone close) */
  .pc { position: relative; margin: 14px 2px 4px; padding: 14px 16px; background: #d4000f; color: #fff; transform: rotate(-1.5deg);
    box-shadow: 0 0 0 3px #000, 7px 7px 0 3px rgba(0,0,0,.35); }
  .pc.fresh { animation: pcIn .42s cubic-bezier(.2,1.3,.4,1) both; }
  .pc.sent { animation: pcOut .42s .95s cubic-bezier(.5,0,.8,.3) forwards; pointer-events: none; }   /* after "Copied — opening…" has been read; the bar closes at 1.8s */
  @keyframes pcIn { 0% { opacity: 0; transform: translate(-40px, 70px) rotate(-24deg) scale(.6); } 60% { opacity: 1; transform: translate(0, -4px) rotate(2deg) scale(1.04); } }
  @keyframes pcOut { to { opacity: 0; transform: translate(90px, -130px) rotate(16deg) scale(.7); } }
  .pc::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .22; background-image: radial-gradient(#000 1.1px, transparent 1.6px); background-size: 6px 6px; }
  .pc > * { position: relative; }
  .pc-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px; }
  .pc-t { font-size: 22px; }
  .pc-to { font: 16px/1 var(--anton); letter-spacing: .08em; white-space: nowrap; }
  .pc textarea { display: block; width: 100%; min-height: 72px; margin-top: 10px; padding: 10px 12px; border: 0; border-radius: 0; resize: none; overflow: hidden;
    background: #fff; color: #000; font: 500 14px/1.55 var(--sans); box-shadow: 0 0 0 2px #000; }
  .pc textarea:focus { outline: none; box-shadow: 0 0 0 2px #000, 5px 5px 0 var(--blue); }
  .pc-f { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .pc .send { background: #000; font-size: 13px; padding: 5px 14px; box-shadow: 3px 3px 0 #fff; }
  .pc .cancel { background: #fff; color: #000; font-size: 13px; padding: 5px 14px; }
  .pc-sign { margin-left: auto; font: 900 13px/1 var(--serif); }

  /* TACTICS: the user's standing orders for the judge, like the game's party tactics - you set the policy, they act on it */
  .tc-back { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.6); }
  .tc-back[hidden] { display: none; }
  .tc { width: min(620px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px 20px 22px; background: #fff; color: #000;
    transform: rotate(-1deg); box-shadow: 0 0 0 4px #000, 10px 10px 0 4px var(--red-2); animation: tcIn .32s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes tcIn { from { opacity: 0; transform: translate(-30px, 40px) rotate(-8deg) scale(.85); } }
  .tc-h { font-size: 26px; }
  .tc-sub { margin: 8px 0 14px; font-weight: 700; font-size: 14px; }
  .tc-list { display: grid; gap: 10px; }
  .tc-row { display: flex; align-items: flex-start; gap: 10px; }
  .tc textarea { flex: 1; min-width: 0; padding: 8px 12px; border: 0; border-radius: 0; resize: none; overflow: hidden; background: #fff; color: #000;
    font: 500 14px/1.55 var(--sans); box-shadow: 0 0 0 2px #000; }
  .tc textarea:focus { outline: none; box-shadow: 0 0 0 2px #000, 5px 5px 0 var(--blue); }
  .tc-row.hl textarea { box-shadow: 0 0 0 3px var(--red), 5px 5px 0 #000; }   /* the order an item's mark points at */
  /* the entry, on the Requests heading, and the mark on an item a tactic placed */
  .sec-tac { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 2px 6px 2px 12px; border: 0; background: #fff; color: #000;
    font: 900 13px/1.5 var(--sans); letter-spacing: .08em; transform: skewX(-12deg); box-shadow: 3px 3px 0 #000; }
  .sec-tac b { min-width: 20px; padding: 0 5px; background: #000; color: #fff; font: 15px/1.3 var(--anton); letter-spacing: 0; text-align: center; }
  .sec-tac:hover { background: #000; color: #fff; box-shadow: 3px 3px 0 var(--blue); } .sec-tac:hover b { background: #fff; color: #000; }
  .tac { flex: none; padding: 0 7px; border: 0; background: #fff; color: #000; font: 13px/1.5 var(--anton); letter-spacing: .06em; transform: skewX(-12deg); box-shadow: 0 0 0 2px #000; }
  .tac:hover { background: #000; color: #fff; box-shadow: 0 0 0 2px #fff; }
  .card-kicker .tac { align-self: center; }
  .tc-x { flex: none; display: grid; place-items: center; width: 28px; height: 28px; margin-top: 6px; padding: 0; border: 2px solid #000; border-radius: 50%; background: #fff; color: #000; }
  .tc-x svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .tc-x:hover, .tc-x:focus-visible { background: #000; color: #fff; }
  .tc-add { margin-top: 12px; padding: 3px 12px; border: 0; background: #fff; color: #000; font-weight: 900; font-size: 13px; box-shadow: inset 0 0 0 2px #000; transform: skewX(-12deg); }
  .tc-add:hover { background: #000; color: #fff; }
  .tc-f { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 12px; margin-top: 20px; }   /* bottom right, Back then Confirm, like the game's prompts */
  .tc .send { background: #000; font-size: 13px; padding: 5px 14px; box-shadow: 3px 3px 0 var(--red); }
  .tc .cancel { background: #fff; color: #000; font-size: 13px; padding: 5px 14px; box-shadow: inset 0 0 0 2px #000; }

  /* ---------- PHAN-SITE: what people are saying — worth knowing, no action. In the game these posts scroll by in the
     bottom-right of the day-change screen; here they sit under the IM phone, the right column being "the other people". ---------- */
  /* like every section: heading and count above, the posts' panel below; nothing left to read, just the heading and a 0 */
  .phan-sec { margin-top: 40px; }
  /* like the game's Phan-Site: comments over a smoky dark band, no boxes - set apart from the solid black bars of things to do */
  .phan { position: relative; margin: 0 6px 0 0; padding: 12px 22px 10px; transform: rotate(-1deg);
    background: linear-gradient(100deg, rgba(8,8,8,.88) 0%, rgba(8,8,8,.72) 55%, rgba(8,8,8,.38) 100%); }
  .ph-post { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px 0; color: #fff; }
  .ph-line { font: 800 17px/1.4 var(--sans); }
  .ph-who { font-weight: 900; }
  .ph-tags { display: block; margin: 0 0 5px; transform: rotate(-3deg); transform-origin: left bottom; }   /* above the post, like a Waiting On bar's tags: the text stays flush left */
  .ph-d { display: block; margin-top: 2px; font: 500 13px/1.5 var(--sans); color: rgba(255,255,255,.62); }
  a.ph-post:hover .ph-line { box-shadow: inset 0 -3px 0 var(--blue); }
  /* Got it: a real button (a verb, not a "read" status), low-key until you're on the post */
  .ph-read { flex: none; padding: 3px 12px; border: 0; background: #2a2a2a; color: #ddd; font-size: 12px; font-weight: 900; white-space: nowrap;
    transform: skewX(-12deg); box-shadow: 3px 3px 0 rgba(0,0,0,.6); transition: background .1s, color .1s, transform .12s cubic-bezier(.3,1.8,.5,1); }
  .ph-read > span { display: inline-block; transform: skewX(12deg); }
  .ph-post:hover .ph-read { background: #fff; color: #000; }
  .ph-read:hover { transform: skewX(-12deg) scale(1.08); box-shadow: 4px 4px 0 var(--blue); }
  .ph-post.reading { animation: readOut .26s ease-in forwards; }
  @keyframes readOut { to { opacity: 0; transform: translateX(24px); } }

  /* ---------- completion: MISSION CLEAR ---------- */
  .clearing { pointer-events: none; }
  /* the slash runs from lower-left to upper-right across whatever it cuts; beforeDone() sets the angle and its start height */
  .slash { position: absolute !important; left: -3%; top: var(--top, 50%); width: 106%; height: 12px; margin-top: -6px; z-index: 5 !important; background: var(--red); box-shadow: 0 0 0 3px #000;
    transform: rotate(var(--a, -9deg)) scaleX(0); transform-origin: left center; animation: slash .18s .05s cubic-bezier(.6,0,.4,1) forwards; }
  .rq .slash, .ib .slash, .ph-post .slash { height: 8px; margin-top: -4px; }
  .slash.drop { background: #000; box-shadow: 0 0 0 3px #fff; }   /* a drop's cut is black, outlined white: the reverse of done's red */
  .clear-stamp { position: absolute !important; left: 50%; top: 50%; z-index: 6 !important; padding: 4px 18px; border: 5px solid var(--red); background: rgba(255,255,255,.94); color: var(--red);
    font: 44px/1 var(--anton); letter-spacing: .06em; white-space: nowrap; transform: translate(-50%, -50%) rotate(-12deg) scale(3); opacity: 0;
    animation: stampIn .22s .2s cubic-bezier(.2,1.6,.4,1) forwards; }
  .rq .clear-stamp, .ib .clear-stamp, .ph-post .clear-stamp { font-size: 26px; border-width: 3px; }
  .clear-stamp.drop { border-color: #000; color: #000; }   /* DROPPED: the same exit, in black - closed by choice, not cleared */
  .clearing.card, .clearing.rq, .clearing.ib, .clearing.ph-post { animation: flyoff .34s .62s cubic-bezier(.5,0,.8,.4) forwards; }
  @keyframes slash { to { transform: rotate(var(--a, -9deg)) scaleX(1); } }
  @keyframes stampIn { to { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(1); } }
  @keyframes flyoff { to { opacity: 0; transform: translate(60px, 90px) rotate(10deg) scale(.9); } }

  /* ---------- intro (first paint of a new run) ---------- */
  .intro .card { animation: slam .4s cubic-bezier(.2,1.5,.4,1) both; }
  .intro .rq { animation: slidein .42s cubic-bezier(.2,1.3,.4,1) both; animation-delay: calc(.28s + var(--i) * 70ms); }
  .intro .ib { animation: slidein .4s cubic-bezier(.2,1.3,.4,1) both; animation-delay: calc(.45s + var(--i) * 70ms); }
  .intro .phone-wrap { animation: drop .4s cubic-bezier(.2,1.5,.4,1) both; animation-delay: calc(.4s + var(--i) * 90ms); }
  .intro .alert { animation: bannerIn .32s cubic-bezier(.2,1.5,.4,1) both; }
  .intro .hud-date { animation: dateIn .45s .05s cubic-bezier(.2,1.5,.4,1) both; }
  .intro .trk { animation: trkIn .4s .2s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes slam { 0% { opacity: 0; transform: scale(1.32) rotate(-9deg) skewX(-14deg); } 60% { opacity: 1; transform: scale(.97) rotate(0deg) skewX(3deg); } 100% { transform: rotate(-1.4deg); } }
  @keyframes slidein { from { opacity: 0; transform: translateX(-110%) skewX(-24deg); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-40px) rotate(-8deg) scale(1.1); } }
  @keyframes bannerIn { from { transform: translateX(-100%) rotate(-1.4deg); } }
  @keyframes dateIn { from { opacity: 0; transform: rotate(-20deg) scale(1.5); } }
  @keyframes trkIn { from { opacity: 0; transform: translateX(80px) rotate(-2deg); } }

  /* ---------- responsive ---------- */
  @media (max-width: 980px) {
    .grid { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  }
  @media (max-width: 760px) {
    header.top { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .trk { justify-self: start; justify-items: start; }
    .trk-k { text-align: left; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 16px 16px 70px; }
    .alert { margin: 0 -24px 26px; padding: 12px 24px; }
    .alert-k { font-size: 22px; } .alert-t { font-size: 17px; }
    .hud-date .m { font-size: 36px; } .hud-date .d i { font-size: 76px; } .hud-date .wd { font-size: 22px; right: 34px; }
    .tod { font-size: 22px; }
    .trk-k { font-size: 24px; } .trk-k small { font-size: 16px; } .trk-n { min-width: 52px; height: 58px; font-size: 50px; }
    .trk-bar > span { font-size: 17px; padding: 4px 24px 5px 28px; }
    .card { margin: 4px 4px 56px 0; padding: 18px 16px 26px; box-shadow: 9px 9px 0 #000; }
    .card::before { width: 74px; height: 74px; } .card .no { font-size: 22px; right: 6px; } .card .no.eff { font-size: 36px; right: 8px; }
    .card-kicker { padding-right: 44px; }
    .acts, .card .composer-btns { padding-right: 0; padding-bottom: 36px; }
    .stamp { width: 82px; height: 82px; right: 14px; bottom: -34px; }
    .stamp .st-mid { font-size: 26px; }
    .rq { grid-template-columns: 76px minmax(0, 1fr) 40px 30px; row-gap: 4px; --x: 0px !important; padding: 8px 12px 8px 4px; }
    .st { grid-row: 1 / 3; }
    .rq-t, .rq-r { white-space: normal; line-height: 1.4; }
    .rq-w { grid-column: 2; grid-row: 2; justify-self: start; }
    .rq-c { grid-column: 3; grid-row: 1 / 3; font-size: 34px; }
    .rq .rq-acts { grid-column: 4; grid-row: 1 / 3; flex-direction: column; gap: 8px; }
    .rq-end { grid-column: 2; grid-row: 2; }
    .rq.done .rq-c { font-size: 26px; }
    .st.new { font-size: 20px; } .st.done { font-size: 24px; }
    .st.hot, .st.upd, .st.due { font-size: 15px; }   /* DEADLINE fits the 76px column */
    .phone-in { padding: 12px 10px 14px; }
    .ib-detail { margin: 8px 0 6px 8px; }
    .pc-sign { margin-left: 0; }
  }
  /* no mouse to hover with: the buttons stay on, in a column of their own */
  @media (hover: none) { .rq .rq-acts { opacity: .8; pointer-events: auto; } .rq.sel .rq-c { opacity: 1; } }
  @media (hover: none) and (min-width: 601px) { .rq { grid-template-columns: 80px minmax(0, 1fr) auto 64px auto; } .rq .rq-acts { grid-column: 5; } }
  @media (prefers-reduced-motion: reduce) {
    .goto, .sun .rays, .burst, .why.hot, .alert-k, .hud-sync::before, .tod > span, .tod::after, .ib-detail, .ib-msg, .ib-hd, .ib-foot, .ib-quote, .pc, .tc { animation: none !important; }
    .intro * { animation: none !important; }
  }
</style>
</head>
<body>
<div class="sun" aria-hidden="true"><div class="rays"></div></div>
<div class="bg" aria-hidden="true"><div class="slab"></div><div class="stripe"></div><div class="stripe w"></div><div class="dots"></div></div>
<div class="wrap" id="app"></div>
<script id="data" type="application/json">__BRIEF_DATA__</script>
<script src="state.js"></script>
<script>
// ===== Meta-Nav core — paste verbatim into each design's first <script>. =====
// Same brief.json contract and the same click store (state.js / localStorage) as template.html, so done clicks carry over
// between designs. A design only draws: it defines render() (reading model()) and calls start(render).

const B = JSON.parse(document.getElementById('data').textContent);
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// GitHub board statuses and channel names carry emoji; drop them
const plain = t => String(t ?? '').replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}️‍]/gu, '').replace(/\s+/g, ' ').trim();
const hhmm = d => d.toTimeString().slice(0, 5);
const mins = iso => Math.round((Date.now() - Date.parse(iso)) / 60000);
// A bare time always means today: "09:23"; otherwise its day goes with it — "Yesterday 20:22", "Mon 20:22"
const dayTime = iso => {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const days = Math.round((new Date(new Date().toDateString()) - new Date(d.toDateString())) / 864e5);
  return days <= 0 ? hhmm(d) : days === 1 ? `Yesterday ${hhmm(d)}` : `${d.toLocaleDateString('en-AU', { weekday: 'short' })} ${hhmm(d)}`;
};
const names = w => Array.isArray(w) ? w : String(w || '').split(/[、,，&]\s*|\s+and\s+/).map(s => s.trim()).filter(Boolean);
const todayAt = t => new Date(`${B.date}T${t}`);
// Stable pseudo-random per item (positions, tilts) so the layout doesn't jump on the 60s reload
const hash = s => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.codePointAt(0), 16777619); return h >>> 0; };
const rnd = (s, lo = 0, hi = 1) => lo + (hash(s) % 10000) / 10000 * (hi - lo);

const SRC_NAME = { mail: 'Outlook', teams: 'Teams', github: 'GitHub', ado: 'Azure DevOps', pbi: 'GitHub issue' };

// The user's clicks. With the state service running (state.py) the done / resolved / read clicks live in ~/metanav/state.json,
// shared by every browser and read by each run; state.js beside the page carries a copy in. Without it (a preview,
// or the service not installed) they stay in this browser, as before. "Done" is stored with the item's activity time
// when dismissed, so anything newer on it (a reply, a nudge) brings it back flagged.
const STATE_URL = 'http://127.0.0.1:47615/state';
let SHARED = window.towerState || null;
const local = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch { return {}; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
// a click the service didn't take (it was down) is kept here and handed over on the next load
const unsaved = (k, on) => { const u = local.get('tower:unsaved'); if (on) u[k] = 1; else delete u[k]; local.set('tower:unsaved', u); };
const push = (k, v) => fetch(STATE_URL, { method: 'POST', body: JSON.stringify({ key: k, value: v }) })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(s => { SHARED = s; unsaved(k, false); })
  .catch(() => unsaved(k, true));
const store = (k, shared = false) => ({
  get() { return shared && SHARED ? SHARED[k] || {} : local.get(k); },
  set(v) {
    local.set(k, v);

const DONE = store('tower:dismissed', true), TAB = store('tower:tab');
// The user's tactics: { orders: ["…", …] }, standing orders in their own words that every run reads (JUDGE.md step 5)
const TACTICS = store('metanav:tactics', true);
const entry = v => typeof v === 'string' ? { at: v, when: '', title: '' } : v;
const keyOf = x => x.id || x.url || x.title || x.what;
const convOf = k => { k = String(k || ''); const m = k.match(/^msteams:\/l\/message\/([^/]+)/) || k.match(/^(19:[^/#]+)/); return m ? decodeURIComponent(m[1]) : k; };
const actAt = x => x.last_activity || x.at || '';
let D = DONE.get();
const isHidden = x => keyOf(x) in D && !(actAt(x) > entry(D[keyOf(x)]).at);
const resurfaced = x => keyOf(x) in D && actAt(x) > entry(D[keyOf(x)]).at;
const flagOf = x => x.new ? '新' : (x.updated || resurfaced(x)) ? '更新' : '';

function age(l) {
  if (l.due) return l.due;
  if (!l.since) return '';
  const d = Math.floor((new Date(new Date().toDateString()) - new Date(new Date(l.since).toDateString())) / 864e5);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : `${d} days`;
}
// calendar days since the ask — the same count age() shows
const waitDays = w => w.since ? Math.max(0, Math.floor((new Date(new Date().toDateString()) - new Date(new Date(w.since).toDateString())) / 864e5)) : 0;

const isChat = u => /^(msteams:|mailto:|https:\/\/outlook\.)/.test(u || '');
const replyUrl = x => x.reply_url || (x.actions || []).map(a => a.url).find(isChat) || (isChat(x.url) ? x.url : '');
const via = u => /^msteams:/.test(u) ? 'Teams' : u ? 'Outlook' : '';
// An item's buttons: its actions, or a plain "Open" to its url
const actionsOf = x => x.actions?.length ? x.actions : x.url ? [{ label: 'Open', url: x.url }] : [];

// PR state as [tone, label] pairs; tone is ok | warn | bad
const REVIEW = { APPROVED: ['ok', 'Approved'], CHANGES_REQUESTED: ['bad', 'Changes requested'], REVIEW_REQUIRED: ['warn', 'Needs review'], PENDING: ['warn', 'Needs review'] };
const CI = { SUCCESS: ['ok', 'CI ✓'], FAILURE: ['bad', 'CI ✗'], ERROR: ['bad', 'CI ✗'], PENDING: ['warn', 'CI …'], EXPECTED: ['warn', 'CI …'] };
const prBits = p => p.draft ? [['warn', 'Draft']] : [REVIEW[p.review], CI[p.ci]].filter(Boolean);

// Everything a design needs, derived fresh on every render.
function model() {
  D = DONE.get();
  const now = new Date();
  const vis = xs => (xs || []).filter(x => !isHidden(x));
  const all = [...(B.queue || []), ...(B.waiting || []), ...(B.highlights || [])];

  const ranked = vis(B.queue);        // ranked by the run
  const queue = ranked;               // all of it: how long the list is, is the run's call, not the page's
  const [top, ...rest] = queue;
  const waiting = vis(B.waiting), highlights = vis(B.highlights);

  // done today = the run's closures + the user's own "done" clicks since local midnight, newest first
  // (yesterday's work is the daily scrum's job)
  const dayStart = new Date(new Date().toDateString()).toISOString();
  const manual = Object.entries(D).map(([key, v]) => ({ key, ...entry(v) }))
    .filter(m => m.when && m.when >= dayStart && !all.some(x => keyOf(x) === m.key && resurfaced(x)));
  const liveKeys = new Set(all.map(keyOf));
  // a click stays the user's row (their title, UNDO); when the run confirms it (a done row with the same id),
  // what actually happened shows under it, like a receipt, and the run's own row isn't shown twice
  const confirmed = new Map((B.done || []).filter(d => d.id).map(d => [d.id, d]));
  const manualShown = manual.filter(m => liveKeys.has(m.key)
    || !manual.some(o => o !== m && liveKeys.has(o.key) && convOf(o.key) === convOf(m.key)));
  const done = [
    ...(B.done || []).filter(d => !d.at || d.at >= dayStart).filter(d => !(d.id && manualShown.some(m => m.key === d.id)))
      .map(d => ({ what: d.what, url: d.url, label: (d.at && dayTime(d.at)) || d.when, at: d.at || '', new: !!d.new, effort: d.effort })),
    // a dismissed one stays too, stamped DROPPED: it left the list by the user's decision, not by being done
    ...manualShown.map(m => m.dismissed ? { what: m.title, url: m.url, label: dayTime(m.when), at: m.when, key: m.key, dropped: true }
      : { what: m.title, url: m.url, label: dayTime(m.when), at: m.when, key: m.key, note: confirmed.get(m.key)?.what,
        effort: m.effort || confirmed.get(m.key)?.effort }),
  ].sort((a, b) => b.at.localeCompare(a.at));

  // what others owe, grouped by person; whoever is worth chasing now goes first, then the longest wait
  const people = new Map();
  waiting.forEach(w => names(w.who).forEach(n => (people.get(n) || people.set(n, { name: n, items: [] }).get(n)).items.push(w)));
  const ledger = [...people.values()].map(p => ({ ...p, due: p.items.some(w => w.nudge_now), days: Math.max(0, ...p.items.map(waitDays)) }))
    .sort((x, y) => (y.due - x.due) || (y.days - x.days));

  // in progress: sprint PBIs and my PRs, plus review requests not already in the queue
  const queuedText = queue.map(q => `${q.title} ${q.reason || ''}`).join(' ');
  const queued = p => queue.some(q => keyOf(q) === p.url) || new RegExp(`#${p.number}\\b`).test(queuedText);
  const work = (B.work || []).map(w => ({ ...w, title: plain(w.title), status: plain(w.status) }));
  const reviews = (B.review_requests || []).filter(p => !queued(p)).map(p => ({ ...p, title: plain(p.title) }));

  // sync state
  const sources = B.sources || [], failed = sources.filter(s => !s.ok);
  const interval = B.interval_min || 60, m = mins(B.generated_at);
  const at = hhmm(new Date(B.generated_at)), next = hhmm(new Date(Date.parse(B.generated_at) + interval * 60000));
  const state = B.syncing ? 'syncing' : failed.length ? 'failed' : m > 1.5 * interval ? 'stale' : 'ok';
  const sync = {
    state, at, next, ago: m,
    text: { syncing: `Syncing… (last ${at})`, failed: `${failed.map(s => s.name).join(', ')} not synced`, stale: `Synced ${at} · stale`, ok: `Synced ${at}` }[state],
    tip: sources.map(s => `${s.name} ${s.ok ? '✓' : '✗ ' + (s.note || '')}`).join('\n') + `\nNext sync ${next}`,
  };

  // today's calendar, each meeting marked past / now / next / later
  const cal = (B.calendar || []).slice().sort((a, b) => (a.all_day ? '' : a.start).localeCompare(b.all_day ? '' : b.start)).map(c => ({ ...c }));
  let nextMarked = false;
  for (const c of cal) {
    if (c.all_day) { c.state = 'allday'; continue; }
    const s = todayAt(c.start), en = todayAt(c.end);
    c.state = en <= now ? 'past' : s <= now ? 'now' : nextMarked ? 'later' : (nextMarked = true, 'next');
    c.minsTo = Math.round((s - now) / 60000);
  }
  const meeting = { now: cal.find(c => c.state === 'now') || null, next: cal.find(c => c.state === 'next') || null };

  // what moved since the last run; nothing on a first run
  const shown = [...queue, ...waiting, ...highlights];
  const counts = { fresh: shown.filter(x => x.new).length, moved: shown.filter(x => !x.new && flagOf(x)).length, closed: done.filter(d => d.at >= B.since).length };
  const firstRun = B.first_run ?? hhmm(new Date(B.since)) === '00:00';

  return { now, ranked, queue, top, rest, waiting, ledger, highlights, done, work, reviews, sources, failed, sync, cal, meeting, counts, firstRun };
}

// ---- actions: designs put these data-* attributes on their controls; the core handles the clicks ----
// [data-done]    + doneAttrs(item)       mark done (design may animate first via beforeDone(el))
// [data-restore="key"]                   undo a manual done
// [data-nudge="key"]                     open / close the nudge composer for that item (openNudge)
// [data-composer] > textarea + [data-send][data-url] + [data-cancel]
// [data-tab="name"]                      toggle TAB.get().open
// [data-dismiss] + dismissAttrs(item): not mine / won't do - hidden like done, and listed as DROPPED, not DONE!
const dismissAttrs = x => doneAttrs(x).replace('data-done', 'data-dismiss');
const doneAttrs = x => `data-done data-key="${e(keyOf(x))}" data-at="${e(actAt(x))}" data-title="${e(x.title || x.what)}" data-url="${e(x.url || '')}" data-effort="${e(x.effort || '')}"`;
let openNudge = '';   // which item has its composer open (not persisted)
const composer = (text, url, { cancellable = true, extra = '' } = {}) => `<div class="composer" data-composer>
  <textarea spellcheck="false">${e(text)}</textarea>
  <div class="composer-btns"><button class="send" data-send data-url="${e(url)}">Copy & open ${via(url)}</button>${extra}${cancellable ? '<button class="cancel" data-cancel>Cancel</button>' : ''}</div></div>`;

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}
const go = url => { if (!url) return; if (/^https?:/.test(url)) window.open(url, '_blank', 'noopener'); else location.href = url; };

// The first paint of this run in this tab: designs play their intro only then, not on every reload.
const FRESH_RUN = (() => { try { const was = sessionStorage.getItem('tower:seen-run'); sessionStorage.setItem('tower:seen-run', B.generated_at); return was !== B.generated_at; } catch { return true; } })();

let beforeDone = null;   // optional: async el => {} — a design's "done" (or drop) animation, awaited before the re-render
let holding = false;     // a design's own sheet is open (tactics): no repaint or reload under it
function start(render) {
  document.addEventListener('click', async ev => {
    const t = ev.target.closest('[data-done], [data-dismiss], [data-restore], [data-nudge], [data-send], [data-cancel], [data-tab]');
    if (!t) return;
    ev.preventDefault(); ev.stopPropagation();
    if (t.matches('[data-done]')) {
      if (beforeDone) await beforeDone(t);
      D = DONE.get();
      D[t.dataset.key] = { at: t.dataset.at, when: new Date().toISOString(), title: t.dataset.title, url: t.dataset.url, ...(t.dataset.effort && { effort: t.dataset.effort }) };
      DONE.set(D);
    } else if (t.matches('[data-dismiss]')) {
      if (beforeDone) await beforeDone(t);
      D = DONE.get();
      D[t.dataset.key] = { at: t.dataset.at, when: new Date().toISOString(), title: t.dataset.title, url: t.dataset.url, dismissed: true };
      DONE.set(D);
    } else if (t.matches('[data-restore]')) {
      D = DONE.get(); delete D[t.dataset.restore]; DONE.set(D);
    } else if (t.matches('[data-tab]')) {
      TAB.set({ open: TAB.get().open === t.dataset.tab ? '' : t.dataset.tab });
    } else if (t.matches('[data-nudge]')) {
      openNudge = openNudge === t.dataset.nudge ? '' : t.dataset.nudge;
    } else if (t.matches('[data-cancel]')) {
      openNudge = '';
    } else {   // [data-send]: copy whatever is in the box (the user may have edited it), then open the chat
      const ok = await copy(t.closest('[data-composer]').querySelector('textarea').value);
      t.textContent = ok ? 'Copied — opening…' : 'Copy failed';
      go(t.dataset.url);
      setTimeout(() => { openNudge = ''; render(); }, 1800);
      return;
    }
    render();
  });
  // Don't repaint or reload under someone editing a nudge or their tactics.
  const editing = () => openNudge || holding || document.activeElement?.tagName === 'TEXTAREA';
  render();
  setInterval(() => editing() || render(), 30e3);          // keep clocks and the next-meeting line live
  // Pick up the next run's rewrite of this file. render.py writes stamp.js beside it: reload only when that changes,
  // so the page isn't torn down and rebuilt every minute for nothing. No stamp.js (a preview): reload as before.
  const load = (file, onload, onerror) => {
    const s = document.createElement('script');
    s.src = `${file}?${Date.now()}`;
    s.onload = () => { s.remove(); onload(); };
    s.onerror = () => { s.remove(); onerror?.(); };
    document.head.append(s);
  };
  const poll = () => {
    load('stamp.js', () => { if (window.towerStamp !== B.stamp && !editing()) location.reload(); }, () => editing() || location.reload());
    // a click in another browser: pick it up without a reload
    load('state.js', () => { const t = window.towerState; if (t && t.rev !== SHARED?.rev && !editing()) { SHARED = t; render(); } });
  };
  setInterval(() => editing() || poll(), 60e3);
}
// ===== end Meta-Nav core =====


// ===== Calling Card · Phantom v2 =====
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const WEEKDAY = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
// time of day, set in two staggered lines like the game's "After / School"
const TOD = h => h < 5 ? ['Late', 'Night'] : h < 8 ? ['Early', 'Morning'] : h < 11 ? ['Morning'] : h < 13 ? ['Lunchtime'] : h < 15 ? ['Afternoon'] : h < 18 ? ['After', 'School'] : h < 22 ? ['Evening'] : ['Late', 'Night'];
const SRC_TAG = { github: 'GITHUB', teams: 'TEAMS', mail: 'OUTLOOK', ado: 'AZURE DEVOPS' };
const flagHtml = f => f === '新' ? '<span class="burst"><i>NEW!</i></span>' : f === '更新' ? '<span class="tag-upd">UPDATE</span>' : '';
// calendar days since the ask — the same count age() shows on each row
const calDays = w => w.since ? Math.max(0, Math.floor((new Date(new Date().toDateString()) - new Date(new Date(w.since).toDateString())) / 864e5)) : 0;
const linkOpen = (url, who) => url ? `href="${e(url)}" target="_blank" rel="noopener"${who ? ` data-who="${e(who)}"` : ''}` : '';

// Ransom-note collage, like the game's calling cards: every CJK character is its own clipping, but a Latin word
// or a number ("review", "#1796") is cut out whole. Black / white / cream paper only.
// Skin, font, tilt and scale come from rnd(), so the same title always looks the same.
function ransom(text, seed, cls = '', SKINS = ['w', 'b', 'p', 'w', 'b']) {
  const toks = String(text ?? '').match(/[A-Za-z0-9#@.\-_:\/,'’!?;&+()]+|\s+|./gu) || [];
  return `<span class="ransom ${cls}" role="text" aria-label="${e(text)}">` + toks.map((p, i) => {
    if (/^\s+$/.test(p)) return '<span class="rn-gap"></span>';
    const k = `${seed}|${i}|${p}`;
    const latin = /^[A-Za-z0-9#@.\-_:\/]+$/.test(p);
    const skin = SKINS[Math.floor(rnd(k + 's', 0, SKINS.length - .001))];
    const font = latin ? ['f-anton', 'f-serif', 'f-sans', 'f-anton'][Math.floor(rnd(k + 'f', 0, 3.999))] : ['f-serif', 'f-kuai', 'f-sans'][Math.floor(rnd(k + 'f', 0, 2.999))];
    const j = n => rnd(k + 'c' + n, 0, latin ? 4 : 9).toFixed(1);
    const clip = `polygon(${j(1)}% ${j(2)}%, ${100 - j(3)}% ${j(4)}%, ${100 - j(5)}% ${100 - j(6)}%, ${j(7)}% ${100 - j(8)}%)`;
    const tilt = latin && p.length > 2 ? 3.5 : 7;
    const s = (i === 0 ? 1.18 : rnd(k + 'z', .9, 1.1)).toFixed(2);
    return `<span class="rn ${skin} ${font}" aria-hidden="true" style="--r:${rnd(k + 'r', -tilt, tilt).toFixed(1)}deg;--s:${s};--y:${rnd(k + 'y', -4, 4).toFixed(0)}px;--clip:${clip}">${e(p)}</span>`;
  }).join('') + '</span>';
}

// Short labels are cut letter by letter, like the game's menu titles and the Phan-Site logo.
// Letters are cut one by one but a word stays in one piece: a narrow box breaks the line between words, never inside one.
const collage = (text, seed, cls = '') => {
  let i = 0;
  return `<span class="ransom ${cls}" role="text" aria-label="${e(text)}">` + text.split(' ').map(w =>
    `<span class="rn-word">${[...w].map(c => ransom(c, seed + i++, '', ['w', 'b', 'p'])).join('')}</span>`).join('<span class="rn-gap"></span>') + '</span>';
};

// A source that needs signing in gets a SIGN IN button. Meta-Nav's helper (state.py) opens the sign-in outside the terminal
// and refreshes once it works, so the banner goes by itself. Outlook and Teams sign in together: one button for both.
const signinSaid = {};   // what the button says after a click, kept across the 30s repaints
const banner = V => {
  if (!V.failed.length) return '';
  const shown = new Set();
  const items = V.failed.map(s => {
    const kind = s.name === 'Azure DevOps' ? 'azure' : 'microsoft';
    const btn = /sign.?in|log.?in/i.test(s.note || '') && !shown.has(kind) && shown.add(kind)
      ? ` <button class="alert-go" data-signin="${e(s.name)}" ${signinSaid[s.name] ? 'disabled' : ''}>${e(signinSaid[s.name] || 'SIGN IN')}</button>` : '';
    return `<span class="alert-i">${e(s.name)} offline${s.note ? ` (${e(s.note)})` : ''}${btn}</span>`;
  });
  return `<div class="alert" role="alert"><span class="alert-k">WARNING</span><span class="alert-t">${items.join('')}</span></div>`;
};
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-signin]');
  if (!b) return;
  ev.preventDefault();
  const src = b.dataset.signin;
  let said;
  try {
    const r = await fetch(STATE_URL.replace(/state$/, 'signin'), { method: 'POST', body: JSON.stringify({ source: src }) });
    const { status } = await r.json();
    said = status === 'busy' ? 'BUSY · TRY AGAIN IN A MINUTE' : src === 'Azure DevOps' ? 'CHECK YOUR BROWSER' : 'SIGN IN IN THE NEW WINDOW';
  } catch {
    said = src === 'Azure DevOps' ? 'HELPER OFF · IN A TERMINAL: BROWSER=open az login' : 'HELPER OFF · IN A TERMINAL: metanav';
  }
  signinSaid[src] = said;
  render();

});

// The objective tracker shows the nearest dated promise ("Tue 9/29" — month/day), like "Days until Expulsion: 5".
function tracker(V) {
  const today = new Date(new Date().toDateString());
  const dueDate = s => {
    const m = String(s || '').match(/(\d{1,2})\/(\d{1,2})/);
    if (!m) return null;
    const d = new Date(today.getFullYear(), +m[1] - 1, +m[2]);
    if (d - today < -180 * 864e5) d.setFullYear(d.getFullYear() + 1);   // "1/3" seen in December means next year
    return d;
  };
  const dated = V.ranked.filter(q => q.due).map(q => ({ q, d: dueDate(q.due) }))
    .sort((a, b) => (a.d ? a.d : Infinity) - (b.d ? b.d : Infinity));
  if (!dated.length) return '<div></div>';
  const { q, d } = dated[0];
  const days = d ? Math.round((d - today) / 864e5) : null;
  const box = days === null ? '' : days <= 0 ? '<span class="trk-n today">TODAY</span>' : `<span class="trk-n">${days}</span>`;
  return `<a class="trk" ${linkOpen(q.url, names(q.who)[0])}>
    <div class="trk-top"><span class="trk-k"><small>Days until</small>${e(q.due)}</span>${box}</div>
    <div class="trk-bar"><span>${e(q.title)}</span></div>
  </a>`;
}

// The field HUD, as in the game: date, time of day and one quiet line for the sync. Meetings stay in Outlook;
// the run uses them to order the queue, so a meeting shows up here only as the reason a task moved up.
function header(V) {
  const now = V.now;
  return `<header class="top">
    <div class="hud">
      <div class="hud-date"><span class="hud-back"></span><span class="m">${now.getMonth() + 1}</span><span class="sl"></span>
        <span class="d">${String(now.getDate()).split('').map(x => `<i>${x}</i>`).join('')}</span><span class="wd">${WEEKDAY[now.getDay()]}</span></div>
      <div class="hud-row"><span class="tod ${todFresh(now) ? 'fresh' : ''}">${TOD(now.getHours()).map(s => `<span>${s}</span>`).join('')}</span>${syncPill(V)}</div>
    </div>
    ${tracker(V)}
  </header>`;
}

// The sync pill, and SYNC: a run now through Meta-Nav's helper. The pill says "Syncing…" as soon as it's clicked; the run's own
// flag takes over when it starts (the page reloads), and the new data arrives about a minute later.
let syncAsked = 0, syncHelperOff = false;
function syncPill(V) {
  const asked = syncAsked && Date.now() - syncAsked < 180e3 && V.sync.state !== 'syncing';
  const state = asked ? 'syncing' : V.sync.state;
  if (syncHelperOff) return `<span class="hud-sync failed">Helper off · to sync, run metanav in a terminal</span>`;
  const text = asked ? `Syncing… (last ${V.sync.at})` : V.sync.state === 'failed' ? `Synced ${V.sync.at}` : V.sync.text;
  return `<span class="hud-sync ${state}">${e(text)}</span>` +
    `<button class="hud-go" data-refresh ${state === 'syncing' ? 'disabled' : ''} aria-label="Sync now">SYNC NOW</button>`;
}
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-refresh]');
  if (!b || b.disabled) return;
  ev.preventDefault();
  syncAsked = Date.now(); syncHelperOff = false;
  render();
  try {
    // "busy" means a run is already going: "Syncing…" is right either way
    const r = await fetch(STATE_URL.replace(/state$/, 'refresh'), { method: 'POST', body: '{}' });
    if (!r.ok) throw new Error(r.status);
  } catch {
    syncAsked = 0; syncHelperOff = true;
    render();
  }
});

// The time of day just moved on (Afternoon → After School) since this tab last drew it: play the change once.
function todFresh(now) {
  const slot = TOD(now.getHours()).join(' ');
  try { const was = sessionStorage.getItem('tower:tod'); sessionStorage.setItem('tower:tod', slot); return !reduced && !!was && was !== slot; }
  catch { return false; }
}

// Put the rays' centre behind the date (in page coordinates, so the sun scrolls away with it).
function placeSun() {
  const d = document.querySelector('.hud-date'), sun = document.querySelector('.sun');

addEventListener('resize', placeSun);
document.fonts?.ready.then(placeSun);   // the date's size changes once Anton arrives

function card(V) {
  const t = V.top;
  if (!t) return `<article class="card calm" data-card><span class="no">00</span>
    <div class="card-kicker"><span class="ribbon">TARGET</span></div>
    <h2 class="card-title">${collage('TAKE YOUR TIME', 'calm-card')}</h2></article>`;
  const chat = t.nudge ? replyUrl(t) : '';
  const acts = actionsOf(t).filter(a => !(chat && a.url === chat)).map((a, i) =>
    `<a class="act ${i || chat ? '' : 'primary'}" ${linkOpen(a.url, names(t.who)[0])}><span>${i || chat ? '' : '<b>GO</b> '}${e(a.label)}</span></a>`).join('');
  // Drop sits at the end of the buttons, next to the TAKE IT DONE stamp: the two ways to finish with it, together
  const drop = `<button class="card-d" ${dismissAttrs(t)} title="Drop: not mine, or won't do" aria-label="Drop"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>`;
  const body = chat ? composer(t.nudge, chat, { cancellable: false, extra: acts + drop }) : `<div class="acts">${acts}${drop}</div>`;
  const title = ransom(t.title, keyOf(t));

    <h2 class="card-title">${t.url ? `<a ${linkOpen(t.url, names(t.who)[0])}>${title}</a>` : title}</h2>

    ${body}
